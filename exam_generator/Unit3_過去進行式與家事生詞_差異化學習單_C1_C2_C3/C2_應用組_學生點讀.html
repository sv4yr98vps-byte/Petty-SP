<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit 3 過去進行式與家事生詞 · C2 應用組（積木組句點讀版）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #d97706;
      --primary-hover: #b45309;
      --bg: #fffbeb;
      --card-bg: #ffffff;
      --text: #78350f;
      --text-muted: #64748b;
      --border: #fde68a;
      --chip-bg: #fef3c7;
      --chip-border: #f59e0b;
      --chip-text: #92400e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', 'Outfit', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding-bottom: 60px; }
    header { background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%); color: white; padding: 24px 20px; text-align: center; box-shadow: 0 4px 12px rgba(217,119,6,0.15); }
    header h1 { font-size: 1.65rem; margin-bottom: 6px; font-weight: 700; }
    header p { font-size: 0.95rem; opacity: 0.95; }
    .container { max-width: 860px; margin: 20px auto; padding: 0 16px; }
    .info-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .input-name { padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; font-family: inherit; }
    .voice-status { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; background: #fffdf5; padding: 6px 12px; border-radius: 20px; border: 1px solid #fde68a; color: #b45309; font-weight: 600; }
    .speed-ctrl { display: flex; align-items: center; gap: 4px; font-size: 0.85rem; color: var(--text-muted); }
    .speed-btn { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; cursor: pointer; font-family: inherit; }
    .speed-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }
    .section-title { font-size: 1.25rem; font-weight: 700; color: #92400e; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 22px; box-shadow: 0 3px 8px rgba(0,0,0,0.04); }
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .module-tag { background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 12px; font-size: 0.82rem; font-weight: 700; }
    .q-title { font-size: 1.15rem; font-weight: 700; color: #78350f; line-height: 1.5; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .speaker-btn { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
    .drop-zone { min-height: 56px; background: #fffdf5; border: 2px dashed #f59e0b; border-radius: 12px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .drop-zone.empty::after { content: '👉 點擊下方單字積木，依序組合成正確句子'; color: #94a3b8; font-size: 0.9rem; margin-left: 8px; font-style: italic; }
    .word-pool { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding: 12px; background: #f8fafc; border-radius: 12px; border: 1px solid #e2e8f0; }
    .word-chip-btn { background: var(--card-bg); border: 1.5px solid #cbd5e1; color: #334155; padding: 7px 14px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.15s; user-select: none; }
    .word-chip-btn:hover { border-color: var(--primary); background: #fef3c7; }
    .word-chip-btn.in-drop { opacity: 0.35; pointer-events: none; background: #e2e8f0; }
    .chip-in-drop { background: #fef3c7; border: 1.5px solid #f59e0b; color: #92400e; padding: 6px 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
    .action-row { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-small { padding: 6px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: 1px solid #cbd5e1; background: white; color: #475569; }
    .btn-check { background: var(--primary); color: white; border-color: var(--primary); }
    .btn-check:hover { background: var(--primary-hover); }
    .feedback-box { margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .submit-bar { margin-top: 30px; text-align: center; }
    .btn-submit { background: var(--primary); color: white; border: none; padding: 14px 40px; border-radius: 12px; font-size: 1.2rem; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

<!-- 學生姓名強制彈跳視窗 -->
<div id="studentNameModal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.8); z-index:99999; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
  <div style="background:#ffffff; border-radius:24px; padding:36px 30px; width:90%; max-width:450px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.4); text-align:center; border:2px solid #f59e0b;">
    <div style="font-size:3.2rem; margin-bottom:12px;">🧱 📝</div>
    <h2 style="font-size:1.5rem; color:#0f172a; margin-bottom:8px; font-weight:800;">歡迎進入積木組句挑戰！</h2>
    <p style="color:#64748b; font-size:0.95rem; margin-bottom:22px; line-height:1.5;">請先輸入您的<b>「學生姓名」</b>以記錄組句表現與成績：</p>
    
    <input type="text" id="modalStudentInput" placeholder="請在此輸入姓名 (例如: 陳大明)" style="width:100%; padding:14px 16px; border:2px solid #cbd5e1; border-radius:12px; font-size:1.15rem; text-align:center; font-weight:700; outline:none; box-sizing:border-box;" onkeydown="if(event.key==='Enter') confirmStudentNameModal()">
    
    <div id="modalNameError" style="color:#ef4444; font-size:0.9rem; font-weight:700; margin-top:10px; display:none;">⚠️ 請輸入姓名才能開始作答喔！</div>
    
    <button type="button" onclick="confirmStudentNameModal()" style="width:100%; margin-top:20px; background:linear-gradient(135deg, #d97706 0%, #b45309 100%); color:#ffffff; border:none; padding:15px; border-radius:12px; font-size:1.2rem; font-weight:800; cursor:pointer;">
      🚀 確定並開始挑戰
    </button>
  </div>
</div>

<header>
  <h1>Unit 3 過去進行式與家事生詞</h1>
  <p>🧱 C2 應用組：單字級精細積木組句（8~10塊單字 · 即時檢查核對）</p>
</header>

<div class="container">
  <div class="info-bar">
    <div>
      <label>學生姓名：</label>
      <input type="text" id="studentName" onclick="promptStudentNameModal()" class="input-name" placeholder="請輸入姓名">
    </div>
    <div class="voice-status">
      <span>👩‍🏫 語音反饋：Google 雙語智慧點讀</span>
    </div>
    <div class="speed-ctrl">
      <span>語速:</span>
      <button type="button" class="speed-btn" onclick="setSpeed(1.0, this)">1x</button>
      <button type="button" class="speed-btn" onclick="setSpeed(0.75, this)">0.75x</button>
      <button type="button" class="speed-btn" onclick="setSpeed(0.5, this)">0.5x</button>
      <button type="button" class="speed-btn active" onclick="setSpeed(0.25, this)">0.25x</button>
    </div>
  </div>

  <div class="section-title">🧩 精細單字積木組句練習（共 10 題 · 單字級細分）</div>
  <div id="exercises-container"></div>

  <div class="submit-bar">
    <button class="btn-submit" onclick="submitExam()">送出答案並計算總分</button>
  </div>

  <div id="scoreBanner" style="display:none; margin-top:30px;">
    <div class="card" style="border:3px solid #f59e0b; background:#fffbeb; text-align:center; padding:28px 20px; border-radius:18px;">
      <div style="font-size:3.2rem; line-height:1;">🎉</div>
      <h2 style="font-size:1.6rem; color:#92400e; margin:10px 0 4px;">恭喜完成 C2 應用組積木組句任務！</h2>
      <div id="certStudentText" style="font-weight:700; color:#78350f; margin-bottom:18px;">學生：未填寫 ｜ 表現評價：⭐⭐⭐</div>
      <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:16px 0;">
        <div style="background:white; border:1px solid #fde68a; border-radius:12px; padding:14px;">
          <div style="font-size:1.8rem; font-weight:800; color:#d97706;" id="scoreText">--</div>
          <div style="font-size:0.85rem; color:#64748b; font-weight:600;">🏆 結算總分</div>
        </div>
        <div style="background:white; border:1px solid #fde68a; border-radius:12px; padding:14px;">
          <div style="font-size:1.8rem; font-weight:800; color:#0284c7;" id="firstTryText">-- / 10</div>
          <div style="font-size:0.85rem; color:#64748b; font-weight:600;">🎯 首次即答對題數</div>
        </div>
        <div style="background:white; border:1px solid #fde68a; border-radius:12px; padding:14px;">
          <div style="font-size:1.8rem; font-weight:800; color:#dc2626;" id="attemptsText">0 次</div>
          <div style="font-size:0.85rem; color:#64748b; font-weight:600;">🔄 累計試錯次數</div>
        </div>
      </div>
      <div id="syncStatus" style="background:#eff6ff; border:1px solid #bfdbfe; color:#1e40af; padding:12px; border-radius:10px; font-weight:700; margin:16px 0;">📡 正在同步成績至老師的 Google 雲端學習歷程儀表板...</div>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px;">
        <button type="button" style="background:#d97706; color:white; border:none; padding:10px 18px; border-radius:8px; font-weight:700; cursor:pointer;" onclick="submitExam()">☁️ 重新同步成績</button>
        <button type="button" style="background:#64748b; color:white; border:none; padding:10px 18px; border-radius:8px; font-weight:700; cursor:pointer;" onclick="location.reload()">🔄 重新挑戰</button>
        <a href="index.html" style="background:#0f172a; color:white; text-decoration:none; padding:10px 18px; border-radius:8px; font-weight:700; display:inline-block;">🏠 回單元首頁</a>
      </div>
    </div>
  </div>
</div>

<script>
let currentSpeed = 0.25;
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz9DwqtUX3HliNfYeWu5eb1nnNfE_MfLGw6Jp5NqgQDOia34ld789O6VonfTjkh_rqE/exec';

function setSpeed(spd, btn) {
  currentSpeed = spd;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function speakEnglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = currentSpeed;
  const voices = window.speechSynthesis.getVoices();
  const gVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Natural')) && v.lang.startsWith('en'));
  if (gVoice) u.voice = gVoice;
  window.speechSynthesis.speak(u);
}

function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

// 10 題精細單字級積木（8~11 塊單字）
const exercises = [
  {
    id: 'ex1',
    title: '1. 媽媽昨晚七點正在洗碗盤。',
    chips: ['doing', 'was', 'the', 'Mom', 'seven', 'at', 'dishes', 'night', 'last', '.'],
    correct: 'Mom was doing the dishes at seven last night .'
  },
  {
    id: 'ex2',
    title: '2. 地震發生時，Kelly 正在玩電視遊樂器。',
    chips: ['playing', 'earthquake', 'was', 'the', 'Kelly', 'games', 'when', 'video', 'happened', '.'],
    correct: 'Kelly was playing video games when the earthquake happened .'
  },
  {
    id: 'ex3',
    title: '3. 昨天早上六點，Rokk 先生正在做早餐。',
    chips: ['making', 'yesterday', 'Rokk', 'breakfast', 'was', 'Mr.', 'six', 'at', 'morning', '.'],
    correct: 'Mr. Rokk was making breakfast at six yesterday morning .'
  },
  {
    id: 'ex4',
    title: '4. 地震發生時，Bobbie 和小嬰兒正在睡覺。',
    chips: ['sleeping', 'the', 'were', 'baby', 'and', 'Bobbie', 'earthquake', 'when', 'happened', '.'],
    correct: 'Bobbie and the baby were sleeping when the earthquake happened .'
  },
  {
    id: 'ex5',
    title: '5. 我在夢遊的時候打破了我的杯子。',
    chips: ['broke', 'when', 'sleepwalking', 'my', 'was', 'I', 'cup', 'I', '.'],
    correct: 'I was sleepwalking when I broke my cup .'
  },
  {
    id: 'ex6',
    title: '6. 昨晚七點半時，他們正在拖客廳的地板。',
    chips: ['floor', 'mopping', 'living', 'were', 'the', 'They', 'room', 'at', 'seven', 'thirty', '.'],
    correct: 'They were mopping the living room floor at seven thirty .'
  },
  {
    id: 'ex7',
    title: '7. 地震發生時，Baker 太太正在辦公桌前工作。',
    chips: ['working', 'Baker', 'the', 'was', 'Mrs.', 'desk', 'at', 'when', 'it', 'happened', '.'],
    correct: 'Mrs. Baker was working at the desk when it happened .'
  },
  {
    id: 'ex8',
    title: '8. 孩子們在下午兩點半時正在爬樹。',
    chips: ['climbing', 'half', 'were', 'The', 'children', 'tree', 'a', 'at', 'past', 'two', '.'],
    correct: 'The children were climbing a tree at half past two .'
  },
  {
    id: 'ex9',
    title: '9. 當你打電話給她時，她正在洗衣服。',
    chips: ['clothes', 'called', 'the', 'was', 'She', 'washing', 'when', 'you', 'her', '.'],
    correct: 'She was washing the clothes when you called her .'
  },
  {
    id: 'ex10',
    title: '10. 地震發生時，Job 先生正在爬樓梯。',
    chips: ['stairs', 'climbing', 'Job', 'the', 'was', 'Mr.', 'when', 'earthquake', 'the', 'happened', '.'],
    correct: 'Mr. Job was climbing the stairs when the earthquake happened .'
  }
];

const userState = {};
const checkStatus = {};
const attempts = {};

function initExercises() {
  const container = document.getElementById('exercises-container');
  container.innerHTML = '';

  exercises.forEach(ex => {
    userState[ex.id] = [];
    checkStatus[ex.id] = false;
    attempts[ex.id] = 0;

    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${ex.id}`;

    card.innerHTML = `
      <div class="q-meta">
        <span class="module-tag">精細組句 · ${ex.chips.length} 塊單字積木</span>
        <div style="display:flex; gap:8px;">
          <button class="speaker-btn" onclick="speakChinese('${ex.title.replace(/'/g, "\\'")}')">🔊 中文朗讀</button>
          <button class="speaker-btn" style="background:#e0f2fe; color:#0284c7; border:1px solid #bae6fd;" onclick="speakEnglish('${ex.correct.replace(/'/g, "\\'").replace(' .', '.')}')">🔊 英文朗讀示範</button>
        </div>
      </div>
      <div class="q-title">
        <span>${ex.title}</span>
      </div>
      <div class="drop-zone empty" id="drop-${ex.id}"></div>
      <div class="word-pool" id="pool-${ex.id}">
        ${ex.chips.map((chip, cIdx) => `
          <button class="word-chip-btn" id="chip-${ex.id}-${cIdx}" onclick="addChip('${ex.id}', ${cIdx})">${chip}</button>
        `).join('')}
      </div>
      <div class="action-row">
        <button class="btn-small" onclick="resetExercise('${ex.id}')">🔄 重置</button>
        <button class="btn-small btn-check" onclick="checkSentence('${ex.id}')">✨ 檢查句子</button>
      </div>
      <div class="feedback-box" id="fb-${ex.id}"></div>
    `;
    container.appendChild(card);
  });
}

function addChip(exId, cIdx) {
  if (checkStatus[exId]) return;
  const ex = exercises.find(e => e.id === exId);
  const word = ex.chips[cIdx];
  const chipBtn = document.getElementById(`chip-${exId}-${cIdx}`);
  if (chipBtn.classList.contains('in-drop')) return;

  chipBtn.classList.add('in-drop');
  userState[exId].push({ cIdx, word });
  renderDropZone(exId);
}

function removeChip(exId, sIdx) {
  if (checkStatus[exId]) return;
  const item = userState[exId][sIdx];
  const chipBtn = document.getElementById(`chip-${exId}-${item.cIdx}`);
  if (chipBtn) chipBtn.classList.remove('in-drop');

  userState[exId].splice(sIdx, 1);
  renderDropZone(exId);
}

function renderDropZone(exId) {
  const drop = document.getElementById(`drop-${exId}`);
  drop.innerHTML = '';
  const selected = userState[exId];

  if (selected.length === 0) {
    drop.classList.add('empty');
  } else {
    drop.classList.remove('empty');
    selected.forEach((item, sIdx) => {
      const chip = document.createElement('span');
      chip.className = 'chip-in-drop';
      chip.textContent = item.word;
      chip.onclick = () => removeChip(exId, sIdx);
      drop.appendChild(chip);
    });
  }
}

function resetExercise(exId) {
  if (checkStatus[exId]) return;
  userState[exId] = [];
  const pool = document.getElementById(`pool-${exId}`);
  pool.querySelectorAll('.word-chip-btn').forEach(b => b.classList.remove('in-drop'));
  renderDropZone(exId);
  const fb = document.getElementById(`fb-${exId}`);
  fb.style.display = 'none';
}

function checkSentence(exId) {
  if (checkStatus[exId]) return;
  const ex = exercises.find(e => e.id === exId);
  const currentSentence = userState[exId].map(i => i.word).join(' ').trim();
  const fb = document.getElementById(`fb-${exId}`);

  if (currentSentence === ex.correct.trim()) {
    checkStatus[exId] = true;
    fb.style.display = 'block';
    fb.style.background = '#dcfce7';
    fb.style.color = '#15803d';
    fb.style.border = '1px solid #86efac';
    fb.innerHTML = `✅ <strong>太優秀了，句子完全正確！</strong><br><code>${ex.correct}</code>`;
    speakEnglish(ex.correct.replace(' .', '.'));
  } else {
    attempts[exId]++;
    fb.style.display = 'block';
    fb.style.background = '#fee2e2';
    fb.style.color = '#b91c1c';
    fb.style.border = '1px solid #fca5a5';
    fb.innerHTML = `❌ <strong>順序還差一點點喔！</strong> 已嘗試 ${attempts[exId]} 次。請檢查主詞、was/were 與動詞 ing 的順序！`;
    speakChinese('順序還差一點點喔，再試試看！');
  }
}

function submitExam() {
  const name = (document.getElementById('studentName').value || '').trim();
  if (!name) {
    promptStudentNameModal();
    return;
  }

  let totalScore = 0;
  let firstTryCount = 0;
  let totalAttemptsCount = 0;

  exercises.forEach(ex => {
    const isCorrect = checkStatus[ex.id];
    const att = attempts[ex.id] || 0;
    totalAttemptsCount += att;

    let qScore = 0;
    if (isCorrect) {
      if (att === 0) {
        qScore = 10;
        firstTryCount++;
      } else if (att === 1) {
        qScore = 7;
      } else if (att === 2) {
        qScore = 4;
      } else {
        qScore = 1;
      }
    }
    totalScore += qScore;
  });

  const finalScore = Math.round(totalScore);
  const accuracy = Math.round((firstTryCount / exercises.length) * 100) + '%';
  let stars = '⭐⭐⭐';
  if (finalScore < 60) stars = '⭐';
  else if (finalScore < 80) stars = '⭐⭐';

  document.getElementById('scoreText').textContent = finalScore + ' 分';
  document.getElementById('firstTryText').textContent = `${firstTryCount} / ${exercises.length}`;
  document.getElementById('attemptsText').textContent = totalAttemptsCount + ' 次';
  document.getElementById('certStudentText').textContent = `學生：${name} ｜ 表現評價：${stars}`;
  
  document.getElementById('scoreBanner').style.display = 'block';
  document.getElementById('scoreBanner').scrollIntoView({ behavior: 'smooth' });

  // 雲端同步
  const payload = {
    timestamp: new Date().toLocaleString(),
    name: name,
    student: name,
    studentName: name,
    student_name: name,
    userName: name,
    user_name: name,
    studentId: name,
    unit: '八上 Unit 3 過去進行式與家事生詞',
    level: 'C2 應用組',
    score: finalScore,
    accuracy: accuracy,
    stars: stars,
    attempts: totalAttemptsCount
  };

  const syncStatus = document.getElementById('syncStatus');
  syncStatus.textContent = '📡 正在同步成績至老師的 Google 雲端學習歷程試算表...';
  
  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    syncStatus.innerHTML = '🟢 <strong>成績已成功同步至老師的雲端試算表儀表板！</strong>';
    syncStatus.style.background = '#dcfce7';
    syncStatus.style.color = '#15803d';
    syncStatus.style.borderColor = '#86efac';
  }).catch(() => {
    syncStatus.innerHTML = '⚠️ 雲端連線稍有延遲，本地成績已完成結算。';
  });
}

function initStudentNameModal() {
  const savedName = localStorage.getItem('student_global_name') || '';
  if (savedName) {
    document.getElementById('studentName').value = savedName;
    document.getElementById('studentNameModal').style.display = 'none';
  } else {
    document.getElementById('studentNameModal').style.display = 'flex';
    setTimeout(() => {
      document.getElementById('modalStudentInput').focus();
    }, 300);
  }
}

function confirmStudentNameModal() {
  const name = (document.getElementById('modalStudentInput').value || '').trim();
  const err = document.getElementById('modalNameError');
  if (!name) {
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  localStorage.setItem('student_global_name', name);
  document.getElementById('studentName').value = name;
  document.getElementById('studentNameModal').style.display = 'none';
}

function promptStudentNameModal() {
  const current = document.getElementById('studentName').value || '';
  document.getElementById('modalStudentInput').value = current;
  document.getElementById('studentNameModal').style.display = 'flex';
}

window.addEventListener('DOMContentLoaded', () => {
  initExercises();
  initStudentNameModal();
});
</script>
