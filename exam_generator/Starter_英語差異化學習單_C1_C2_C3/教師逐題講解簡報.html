<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中英語【國一 · 七年級】Starter 差異化教學講解簡報</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #f59e0b;
      --border: #334155;
      --c1: #10b981;
      --c2: #f59e0b;
      --c3: #ef4444;
      --font-scale: 1;
    }

    body.light-theme {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 頂部工具列 */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 50;
    }

    body.light-theme header {
      background: rgba(255, 255, 255, 0.85);
    }

    .title-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-teach {
      background: #7c3aed;
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .tool-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* 簡報主舞台 */
    .stage {
      flex: 1;
      position: relative;
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .slide-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 1100px;
      height: 100%;
      max-height: 720px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 10;
      overflow-y: auto;
      font-size: calc(1.1rem * var(--font-scale));
    }

    .slide-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .level-badge {
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      color: white;
    }

    .badge-c1 { background: var(--c1); }
    .badge-c2 { background: var(--c2); }
    .badge-c3 { background: var(--c3); }

    .slide-prompt {
      font-size: calc(1.5rem * var(--font-scale));
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .content-box {
      background: rgba(0, 0, 0, 0.15);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      font-size: calc(1.3rem * var(--font-scale));
      line-height: 1.8;
    }

    body.light-theme .content-box {
      background: #f8fafc;
    }

    .answer-box {
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      border-radius: 16px;
      padding: 20px;
      color: #34d399;
      font-weight: 600;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    body.light-theme .answer-box {
      color: #065f46;
      background: #d1fae5;
    }

    .answer-box.show {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 電子白板 Canvas */
    #whiteboard {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }

    #whiteboard.drawing {
      pointer-events: auto;
      cursor: crosshair;
    }

    /* 底部導航欄 */
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 12px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }

    .key-hints {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }

    .key-hints kbd {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    body.light-theme .key-hints kbd {
      background: #e2e8f0;
      color: #334155;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <span class="badge-teach">教師講解簡報</span>
      <h2 style="font-size:1.15rem;">【國一 · 七年級】Starter 問候與代名詞 教學投影片</h2>
    </div>

    <div class="btn-group">
      <label style="color:var(--text); font-size:0.88rem; font-weight:600;">📑 跳頁：</label>
      <select id="slideSelect" class="tool-btn" onchange="jumpToSlide(parseInt(this.value))">
        <option value="0">第 1 頁：C1 基礎 - 數字認讀與發音 (1~3)</option>
        <option value="1">第 2 頁：C1 基礎 - 數字聽音辨字 (4~6)</option>
        <option value="2">第 3 頁：C2 應用 - 自我介紹問句與答覆</option>
        <option value="3">第 4 頁：C2 應用 - 詢問電話號碼與答覆</option>
        <option value="4">第 5 頁：C3 表達 - 人稱代名詞三格矩陣</option>
        <option value="5">第 6 頁：C3 表達 - 專業英文書寫校對員</option>
      </select>
      <label style="color:var(--text); font-size:0.88rem; font-weight:600; margin-left:4px;">⚡ 語速：</label>
      <select id="speedSelect" class="tool-btn">
        <option value="0.25">🐢 0.25x 極慢速</option>
        <option value="0.4">🐢 0.4x 慢速</option>
        <option value="0.6">0.6x 初學</option>
        <option value="0.85" selected>0.85x 適中</option>
        <option value="1.0">1.0x 標準</option>
      </select>
      <button class="tool-btn" id="btnSpeakSlide" onclick="speakCurrentSlide()">🔊 朗讀本頁 (R)</button>
      <button class="tool-btn" id="btnWb" onclick="toggleWhiteboard()">✏️ 電子白板 (W)</button>
      <button class="tool-btn" onclick="clearWhiteboard()">🧹 清除畫痕</button>
      <button class="tool-btn" onclick="changeFontSize(0.1)">➕ 放大</button>
      <button class="tool-btn" onclick="changeFontSize(-0.1)">➖ 縮小</button>
      <button class="tool-btn" onclick="toggleTheme()">🌓 主題</button>
      <a href="index.html" class="tool-btn" style="text-decoration:none;">🏠 首頁</a>
    </div>
  </header>

  <div class="stage">
    <canvas id="whiteboard"></canvas>
    
    <div class="slide-card" id="slideCard">
      <div>
        <div class="slide-meta">
          <span class="level-badge" id="slideLevel">C1 基礎組</span>
          <span id="slideIndex" style="color:var(--text-muted); font-weight:700;">第 1 / 6 頁</span>
        </div>
        <div class="slide-prompt" id="slidePrompt">題目載入中...</div>
        <div class="content-box" id="slideContent">內容載入中...</div>
      </div>

      <div>
        <div class="answer-box" id="slideAnswer"></div>
        <div style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
          <button class="tool-btn" style="background:#059669; color:white; border:none; padding:10px 20px; font-size:1rem;" onclick="toggleAnswer()">
            👁️ 顯示 / 隱藏答案 (Space)
          </button>
          <span style="font-size:0.9rem; color:var(--text-muted);" id="pedagogyTip">特教教學提示：提供 2 選 1 視覺鷹架</span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="key-hints">
      <span><kbd>←</kbd> 上一頁</span>
      <span><kbd>→</kbd> 下一頁</span>
      <span><kbd>Space</kbd> 答案</span>
      <span><kbd>R</kbd> 朗讀</span>
      <span><kbd>W</kbd> 白板</span>
    </div>

    <div class="btn-group">
      <button class="tool-btn" onclick="prevSlide()">◀ 上一題</button>
      <button class="tool-btn" style="background:var(--primary); color:white;" onclick="nextSlide()">下一題 ▶</button>
    </div>
  </footer>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];

    function initVoices() {
      voices = synth.getVoices();
    }
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = initVoices;
    }
    initVoices();

    const slides = [
      {
        level: "C1 基礎組",
        badgeClass: "badge-c1",
        prompt: "🔤 MODULE A｜數字認讀與發音 (1~3)",
        speechText: "一、數字認讀與發音。1 is one, 2 is two, 3 is three. 看到數字 3，英文是哪一個？ 選項 A: three, 選項 B: two",
        content: `
          <div style="font-size:1.8rem; font-family:'Fredoka',sans-serif; text-align:center; margin-bottom:12px;">
            <div style="display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; font-family:'Fredoka',sans-serif; text-align:center; font-size:1.3rem; margin-bottom:12px;">
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">1 one</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">2 two</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">3 three</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">4 four</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">5 five</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">6 six</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">7 seven</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">8 eight</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">9 nine</div>
            <div style="background:rgba(255,255,255,0.08); padding:8px; border-radius:8px;">10 ten</div>
          </div>
          </div>
          <div style="line-height:2;">
            👦 題目：看到數字 <strong>3</strong>，英文是哪一個？<br>
            選項：(A) three　(B) two
          </div>
        `,
        answer: "✅ 正確答案：(A) three<br>💡 教學解析：引導學生留意 /θri/ 的 th 發音，並透過 3 個點或手指手勢強化數量概念。",
        tip: "C1 鷹架：嚴禁使用中文諧音（如「死綠」），採用標準音檔與手勢重複跟讀。"
      },
      {
        level: "C1 基礎組",
        badgeClass: "badge-c1",
        prompt: "💬 MODULE B｜核心問候語 (How are you?)",
        speechText: "二、核心問候語。Joe 問: How are you? Tina 回答: Blank. Thank you. 二選一套版：A: I am fine, B: Good night",
        content: `
          <div style="line-height:2.2;">
            👦 <strong>Joe:</strong> "How are you?" (你好嗎？)<br>
            👧 <strong>Tina:</strong> "____________. Thank you."<br><br>
            二選一套版：<br>
            (A) I'm fine (我很好)<br>
            (B) Good night (晚安)
          </div>
        `,
        answer: "✅ 正確答案：(A) I'm fine<br>💡 教學解析：建立問候的固定配對（How are you? ➔ I'm fine / Thank you）。",
        tip: "C1 鷹架：情境圖示支援，降低工作記憶負擔。"
      },
      {
        level: "C2 應用組",
        badgeClass: "badge-c2",
        prompt: "🌉 MODULE A｜主格 (I) vs 所有格 (my) 對照橋樑",
        speechText: "三、主格對照所有格。我是 I，我的加名詞是 my。你 you，你的加名詞是 your。選字填空：Hi, I am Mike. Blank name is Mike.",
        content: `
          <div style="line-height:2;">
            <strong>對照規則：</strong><br>
            • 我 <code>I</code> ➔ 我的 <code>my</code> + 名詞<br>
            • 你 <code>you</code> ➔ 你的 <code>your</code> + 名詞<br><br>
            <strong>選字填空：</strong><br>
            "Hi, I am Mike. ______ name is Mike." (Word Bank: my / your / his / her)
          </div>
        `,
        answer: "✅ 正確答案：My<br>💡 教學解析：因為前面是 I am Mike (我是 Mike)，後面指『我的名字』要用所有格 my，且句首第一個字母 M 要大寫。",
        tip: "C2 鷹架：先看對照表再填空，建立結構化橋樑。"
      },
      {
        level: "C2 應用組",
        badgeClass: "badge-c2",
        prompt: "📞 MODULE B｜詢問電話號碼與答覆",
        speechText: "四、詢問電話號碼。問句: What is your phone number? 答句: Blank 2345-0189. 請填入 It's 或 It is.",
        content: `
          <div style="line-height:2.2;">
            A: "What's your phone number?"<br>
            B: "____________ 2345-0189."<br><br>
            請完成答句填空 (縮寫或完整型)：
          </div>
        `,
        answer: "✅ 正確答案：It's / It is / My phone number is<br>💡 教學解析：回答電話號碼以代名詞 It 代替 phone number，縮寫為 It's 或是完整寫 It is。",
        tip: "C2 鷹架：提供句型框架，引導代名詞替換。"
      },
      {
        level: "C3 表達組",
        badgeClass: "badge-c3",
        prompt: "👥 MODULE A｜人稱代名詞三格矩陣",
        speechText: "五、代名詞三格矩陣。主格、所有格與受格。I, my, me. he, his, him. she, her, her. they, their, them.",
        content: `
          <div style="line-height:2;">
            請完成代名詞三格表格：<br>
            • I ➔ my ➔ ( 1. ______ )<br>
            • he ➔ his ➔ ( 2. ______ )<br>
            • she ➔ ( 3. ______ ) ➔ her<br>
            • they ➔ their ➔ ( 4. ______ )
          </div>
        `,
        answer: "✅ 正確答案：1. me / 2. him / 3. her / 4. them<br>💡 教學解析：介系詞 for 後面必須接『受格』(The ball is for him/her/them)。",
        tip: "C3 鷹架：撤除選項提示，建立三格完整文法架構。"
      },
      {
        level: "C3 表達組",
        badgeClass: "badge-c3",
        prompt: "✍️ MODULE E｜專業英文書寫校對員",
        speechText: "六、專業英文書寫校對。題目: how are you? i am fine.thank you. 找出四處錯誤並寫出標準格式。",
        content: `
          <div style="line-height:2.2;">
            請找出 3 處格式錯誤並修正：<br>
            <code>how are you? i am fine.thank you</code>
          </div>
        `,
        answer: "✅ 正確標準句子：<code>How are you? I am fine. Thank you.</code><br>💡 修正重點：1. How 句首大寫 2. 代名詞 I 永遠大寫 3. Thank 句首大寫 4. fine. 與 Thank 間空一格。",
        tip: "C3 鷹架：訓練獨立檢核能力與正確英文書寫標點習慣。"
      }
    ];

    let currentSlide = 0;
    let isDrawing = false;
    let whiteboardActive = false;
    let canvasMemory = {};
    let fontScale = 1;

    const canvas = document.getElementById('whiteboard');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const stage = document.querySelector('.stage');
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;
      redrawCurrentSlideMemory();
    }
    window.addEventListener('resize', resizeCanvas);

    function jumpToSlide(idx) {
      if (idx >= 0 && idx < slides.length) {
        saveCurrentSlideMemory();
        currentSlide = idx;
        renderSlide();
      }
    }

    function renderSlide() {
      const sel = document.getElementById('slideSelect');
      if (sel) sel.value = currentSlide;
      synth.cancel();
      const s = slides[currentSlide];
      document.getElementById('slideLevel').textContent = s.level;
      document.getElementById('slideLevel').className = `level-badge ${s.badgeClass}`;
      document.getElementById('slideIndex').textContent = `第 ${currentSlide + 1} / ${slides.length} 頁`;
      document.getElementById('slidePrompt').innerHTML = s.prompt;
      document.getElementById('slideContent').innerHTML = s.content;
      document.getElementById('slideAnswer').innerHTML = s.answer;
      document.getElementById('slideAnswer').classList.remove('show');
      document.getElementById('pedagogyTip').textContent = s.tip;

      redrawCurrentSlideMemory();
    }

    function speakCurrentSlide() {
      if (!synth) return;
      synth.cancel();
      const s = slides[currentSlide];
      const utter = new SpeechSynthesisUtterance(s.speechText || s.prompt);
      utter.lang = 'zh-TW';
      const zhVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('cmn-Hant-TW') || v.lang.includes('TW') || v.lang.includes('zh'));
      if (zhVoice) utter.voice = zhVoice;
      const sp = parseFloat(document.getElementById('speedSelect')?.value) || 0.85; utter.rate = sp;
      synth.speak(utter);
    }

    function toggleAnswer() {
      document.getElementById('slideAnswer').classList.toggle('show');
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        saveCurrentSlideMemory();
        currentSlide++;
        renderSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        saveCurrentSlideMemory();
        currentSlide--;
        renderSlide();
      }
    }

    function toggleWhiteboard() {
      whiteboardActive = !whiteboardActive;
      const btn = document.getElementById('btnWb');
      if (whiteboardActive) {
        btn.classList.add('active');
        canvas.classList.add('drawing');
      } else {
        btn.classList.remove('active');
        canvas.classList.remove('drawing');
      }
    }

    function clearWhiteboard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvasMemory[currentSlide] = null;
    }

    function saveCurrentSlideMemory() {
      canvasMemory[currentSlide] = canvas.toDataURL();
    }

    function redrawCurrentSlideMemory() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (canvasMemory[currentSlide]) {
        const img = new Image();
        img.src = canvasMemory[currentSlide];
        img.onload = () => ctx.drawImage(img, 0, 0);
      }
    }

    // 畫筆監聽
    let lastX = 0, lastY = 0;
    canvas.addEventListener('mousedown', (e) => {
      if (!whiteboardActive) return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      lastX = e.clientX - rect.left;
      lastY = e.clientY - rect.top;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing || !whiteboardActive) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = document.body.classList.contains('light-theme') ? '#dc2626' : '#facc15';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();

      lastX = x;
      lastY = y;
    });

    window.addEventListener('mouseup', () => {
      if (isDrawing) {
        isDrawing = false;
        saveCurrentSlideMemory();
      }
    });

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
    }

    function changeFontSize(delta) {
      fontScale = Math.max(0.7, Math.min(1.8, fontScale + delta));
      document.documentElement.style.setProperty('--font-scale', fontScale);
    }

    // 鍵盤快捷鍵
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        toggleAnswer();
      }
      if (e.key === 'r' || e.key === 'R') speakCurrentSlide();
      if (e.key === 'w' || e.key === 'W') toggleWhiteboard();
    });

    // 初始化
    setTimeout(() => {
      resizeCanvas();
      renderSlide();
    }, 100);
  </script>

</body>
</html>
