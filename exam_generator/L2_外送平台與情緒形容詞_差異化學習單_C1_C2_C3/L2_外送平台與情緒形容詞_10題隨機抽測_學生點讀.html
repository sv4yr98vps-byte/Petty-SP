<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中英語【國三 · 九年級】L2 外送平台與情緒形容詞 10題線上抽測</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f0f9ff;
      --card-bg: #ffffff;
      --text: #0c4a6e;
      --border: #bae6fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(2,132,199,0.15);
    }

    header h1 { font-size: 1.65rem; margin-bottom: 6px; font-weight: 700; }
    header p { font-size: 0.95rem; opacity: 0.95; }

    .container {
      max-width: 820px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .info-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .input-name {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .q-prompt {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-speak {
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
      color: #0369a1;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-speak:hover { background: #0284c7; color: white; }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

    .opt-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.98rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .opt-btn:hover { background: #f1f5f9; }

    .opt-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
      font-weight: 700;
    }

    .opt-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    .bottom-bar { text-align: center; margin-top: 30px; }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 36px;
      border-radius: 30px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(2,132,199,0.3);
    }

    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-2px); }
  </style>
</head>
<body>

  <header>
    <h1>國中英語【國三 · 九年級】L2 外送平台與情緒形容詞</h1>
    <p>🎲 核心大題庫 · 線上隨機抽取 10 題 · Google 試算表即時同步</p>
  </header>

  <div class="container">
    <div class="info-bar">
      <div>
        <label>👤 學生姓名 / 座號：</label>
        <input type="text" id="studentName" class="input-name" placeholder="例：901 郭同學">
      </div>
      <div>
        <label>⚡ 朗讀語速：</label>
        <select id="speedSelect" style="padding:5px 8px; border-radius:6px; border:1px solid #cbd5e1;">
          <option value="0.25">🐢 0.25x 極慢速</option>
          <option value="0.4">🐢 0.4x 慢速</option>
          <option value="0.6">0.6x 初學</option>
          <option value="0.85" selected>0.85x 適中</option>
          <option value="1.0">1.0x 標準</option>
        </select>
        <a href="index.html" style="text-decoration:none; margin-left:8px; color:var(--primary); font-weight:bold;">🏠 回單元首頁</a>
      </div>
    </div>

    <div id="quiz-container"></div>

    <div class="bottom-bar">
      <button class="btn-submit" onclick="submitQuiz()" type="button">📤 交卷並同步至全班學習儀表板</button>
      <div id="submit-status" style="margin-top:14px; font-weight:bold; font-size:1.05rem;"></div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz9DwqtUX3HliNfYeWu5eb1nnNfE_MfLGw6Jp5NqgQDOia34ld789O6VonfTjkh_rqE/exec';
    
    // 大題庫 (共 20 題供每次隨機抽取 10 題)
    const questionBank = [
      { q: 'What is the English word for "運送；遞送"?', opts: ['delivery', 'uniform', 'discount', 'reason'], ans: 0 },
      { q: 'What is the English word for "制服"?', opts: ['couch', 'uniform', 'driver', 'chance'], ans: 1 },
      { q: 'What is the English word for "折扣"?', opts: ['location', 'chart', 'discount', 'button'], ans: 2 },
      { q: 'What is the English word for "感興趣的 (人感到...)"?', opts: ['interesting', 'interested', 'boring', 'tired'], ans: 1 },
      { q: 'What is the English word for "令人興奮的 (事物令人...)"?', opts: ['excited', 'exciting', 'bored', 'tiring'], ans: 1 },
      { q: 'The cartoon is very ________ to the children.', opts: ['interesting', 'interested', 'bored', 'tired'], ans: 0 },
      { q: 'Peter is ________ with the boring lecture.', opts: ['bored', 'boring', 'exciting', 'surprising'], ans: 0 },
      { q: 'We are all excited ________ our graduation trip.', opts: ['about', 'in', 'at', 'with'], ans: 0 },
      { q: 'She was very surprised ________ the sudden news.', opts: ['at', 'in', 'about', 'with'], ans: 0 },
      { q: 'Are you tired ________ doing the same homework every day?', opts: ['of', 'in', 'about', 'to'], ans: 0 },
      { q: 'Many people believe ________ delivery apps save a lot of time.', opts: ['that', 'which', 'what', 'who'], ans: 0 },
      { q: 'Jane told me that she ________ to the movies with me.', opts: ['could go', 'can go', 'is going', 'goes'], ans: 0 },
      { q: 'Amy said that she ________ tired after working all day.', opts: ['was', 'is', 'be', 'are'], ans: 0 },
      { q: 'Please check your delivery ________ on the map.', opts: ['location', 'reason', 'page', 'button'], ans: 0 },
      { q: 'The app offers a 20% ________ for new users.', opts: ['discount', 'uniform', 'couch', 'driver'], ans: 0 },
      { q: 'He gave the delivery driver a generous ________.', opts: ['tip', 'page', 'chart', 'list'], ans: 0 },
      { q: 'What is the English word for "至少"?', opts: ['at least', 'in a word', 'first of all', 'what is more'], ans: 0 },
      { q: 'What is the English word for "輕觸；輕點"?', opts: ['tap', 'mind', 'offer', 'age'], ans: 0 },
      { q: 'The big dog is scary, and the boy is ________.', opts: ['scared', 'scary', 'boring', 'interested'], ans: 0 },
      { q: 'Climbing up the stairs with five boxes is ________.', opts: ['tiring', 'tired', 'bored', 'surprised'], ans: 0 }
    ];

    let currentQuiz = [];
    const userAnswers = {};

    let bestEnVoice = null;
    let bestZhVoice = null;

    function initVoices() {
      const voices = window.speechSynthesis.getVoices();
      bestEnVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Natural')) && v.lang.startsWith('en'))
                 || voices.find(v => v.lang.startsWith('en')) || null;
      bestZhVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Han')) && (v.lang.includes('TW') || v.lang.includes('zh')))
                 || voices.find(v => v.lang.startsWith('zh')) || null;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const sp = parseFloat(document.getElementById('speedSelect').value) || 0.85;
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = sp;
      if (/[a-zA-Z]/.test(text)) {
        if (bestEnVoice) utt.voice = bestEnVoice;
        utt.lang = 'en-US';
      } else {
        if (bestZhVoice) utt.voice = bestZhVoice;
        utt.lang = 'zh-TW';
      }
      window.speechSynthesis.speak(utt);
    }

    function initRandomQuiz() {
      const shuffled = questionBank.slice().sort(() => Math.random() - 0.5);
      currentQuiz = shuffled.slice(0, 10);

      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      currentQuiz.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';

        const prompt = document.createElement('div');
        prompt.className = 'q-prompt';
        prompt.innerHTML = '<span>' + (idx + 1) + '. ' + item.q + '</span>';

        const speakBtn = document.createElement('button');
        speakBtn.className = 'btn-speak';
        speakBtn.textContent = '🔊 點讀';
        speakBtn.onclick = () => speakText(item.q);
        prompt.appendChild(speakBtn);
        card.appendChild(prompt);

        const optsDiv = document.createElement('div');
        optsDiv.className = 'options-grid';

        const labels = ['A', 'B', 'C', 'D'];
        item.opts.forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.textContent = '(' + labels[optIdx] + ') ' + optText;
          btn.onclick = () => {
            userAnswers[idx] = optIdx;
            const siblings = optsDiv.querySelectorAll('.opt-btn');
            siblings.forEach((s, sIdx) => {
              s.disabled = true;
              if (sIdx === item.ans) s.classList.add('correct');
              else if (sIdx === optIdx && optIdx !== item.ans) s.classList.add('wrong');
            });
          };
          optsDiv.appendChild(btn);
        });

        card.appendChild(optsDiv);
        container.appendChild(card);
      });
    }

    function submitQuiz() {
      const name = document.getElementById('studentName').value.trim() || '九年級隨機抽測學生';
      let correct = 0;
      currentQuiz.forEach((item, idx) => {
        if (userAnswers[idx] === item.ans) correct++;
      });

      const totalScore = correct * 10;
      const accuracy = totalScore + '%';
      let stars = '⭐⭐⭐';
      if (totalScore < 60) stars = '⭐';
      else if (totalScore < 85) stars = '⭐⭐';

      const statusEl = document.getElementById('submit-status');
      statusEl.style.color = '#0284c7';
      statusEl.textContent = '📡 正在同步成績至老師的 Google 試算表...';

      const payload = {
        timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
        studentName: name,
        unit: '國中英語九上 L2 外送平台與情緒形容詞',
        level: '隨機抽測 10 題',
        score: totalScore,
        accuracy: accuracy,
        stars: stars
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(() => {
        statusEl.innerHTML = '🎉 <strong>交卷成功！</strong> 得分：<span style="color:#0284c7;">' + totalScore + ' 分</span> (' + accuracy + ')，已同步至全班學習儀表板！';
        alert('🎉 交卷成功！\n學生：' + name + '\n得分：' + totalScore + ' 分 (' + accuracy + ')\n星級：' + stars);
      }).catch(err => {
        statusEl.innerHTML = '🎉 作答完成！得分：' + totalScore + ' 分 (離線記錄)';
      });
    }

    initRandomQuiz();
  
    function speakEnglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = (typeof currentSpeed !== 'undefined') ? currentSpeed : 0.25;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && v.lang.includes('US')) ||
                  voices.find(v => v.lang.startsWith('en')) || voices[0];
  if (enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  utter.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && (v.lang.includes('zh') || v.lang.includes('TW'))) ||
                  voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('cmn-Hant-TW') || v.lang.includes('TW')) || voices[0];
  if (zhVoice) utter.voice = zhVoice;
  window.speechSynthesis.speak(utter);
}

function speak(text) {
      if (/[\u4e00-\u9fa5]/.test(text)) {
        speakChinese(text);
      } else {
        speakEnglish(text);
      }
    }

</script>
</body>
</html>
