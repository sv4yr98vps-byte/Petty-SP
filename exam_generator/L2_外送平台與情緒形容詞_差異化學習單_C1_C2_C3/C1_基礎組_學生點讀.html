      font-size: 0.95rem;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--primary);
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .module-tag {
      background: #d1fae5;
      color: #065f46;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;

      background: var(--hint-bg);

      border: 1px solid #fde68a;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;

    .hint-btn:hover { background: #fde68a; }

    .q-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #064e3b;
      line-height: 1.5;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

let userAnswers = {};

function initQuestions() {
  const vContainer = document.getElementById('vocab-container');
  vocabQuestions.forEach((q, idx) => {
    vContainer.appendChild(createScaffoldedCard(q, idx + 1, 4));
  });

  const gContainer = document.getElementById('grammar-container');
  grammarQuestions.forEach((q, idx) => {
    gContainer.appendChild(createScaffoldedCard(q, idx + 9, 3));
  });
}

function createScaffoldedCard(q, num, optCount) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + q.id;

  const metaDiv = document.createElement('div');
  metaDiv.className = 'q-meta';
  metaDiv.innerHTML = `<span class="module-tag">${q.module}</span>`;
  
  const hintBtn = document.createElement('button');
  hintBtn.className = 'hint-btn';
  hintBtn.innerHTML = '💡 提示';
  hintBtn.onclick = () => showHint(q.id, q.hint);
  metaDiv.appendChild(hintBtn);
  card.appendChild(metaDiv);

  const titleDiv = document.createElement('div');
  titleDiv.className = 'q-title';
  titleDiv.innerHTML = `<span>${q.zhTitle}</span>`;

  const speakerBtn = document.createElement('button');
  speakerBtn.className = 'speaker-btn';
  speakerBtn.innerHTML = '🔊 英文朗讀';
  speakerBtn.onclick = () => speakEnglish(q.tts);
  titleDiv.appendChild(speakerBtn);
  card.appendChild(titleDiv);

  const visualBox = document.createElement('div');
  visualBox.className = 'visual-box';
  visualBox.innerHTML = q.visual;
  card.appendChild(visualBox);

  const grid = document.createElement('div');
  grid.className = (optCount === 4) ? 'options-grid-4' : 'options-grid-3';

  q.options.forEach((opt, oIdx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<strong>(${String.fromCharCode(65 + oIdx)})</strong> ${opt}`;
    btn.onclick = () => selectOption(q.id, oIdx, q.ans, q.expCorrect, q.expWrong);
    btn.id = `btn-${q.id}-${oIdx}`;
    grid.appendChild(btn);
  });

  card.appendChild(grid);

  const fb = document.createElement('div');
  fb.className = 'feedback-box';
  fb.id = 'fb-' + q.id;
  card.appendChild(fb);

  return card;
}

function showHint(qId, hintText) {
  const fb = document.getElementById('fb-' + qId);
  fb.style.display = 'block';
  fb.style.background = '#fef3c7';
  fb.style.color = '#92400e';
  fb.style.borderLeft = '4px solid #f59e0b';
  fb.innerHTML = '💡 <strong>' + hintText + '</strong>';
  speakChinese(hintText);
}

function selectOption(qId, selectedIdx, correctIdx, expCorrect, expWrong) {
  userAnswers[qId] = selectedIdx;
  const isCorrect = (selectedIdx === correctIdx);
  const card = document.getElementById('card-' + qId);
  const btns = card.querySelectorAll('.opt-btn');
  
  btns.forEach((btn, idx) => {
    btn.classList.remove('correct', 'wrong');
    if (idx === selectedIdx) {
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });

  const fb = document.getElementById('fb-' + qId);
  fb.style.display = 'block';
  if (isCorrect) {
    fb.style.background = '#dcfce7';
    fb.style.color = '#15803d';
    fb.style.borderLeft = '4px solid #22c55e';
    fb.innerHTML = '✅ <strong>' + expCorrect + '</strong>';
    speakChinese(expCorrect);
  } else {
    fb.style.background = '#fee2e2';
    fb.style.color = '#b91c1c';
    fb.style.borderLeft = '4px solid #ef4444';
    fb.innerHTML = '❌ <strong>' + expWrong + '</strong>';
    speakChinese(expWrong);
  }
}

function setSpeed(speed, btn) {
  currentSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function speakEnglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = currentSpeed;

  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && v.lang.includes('US')) ||
                  voices.find(v => v.lang.startsWith('en')) || voices[0];
  if (enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  utter.rate = 0.85;

  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && (v.lang.includes('zh') || v.lang.includes('TW'))) ||
                  voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('cmn-Hant-TW') || v.lang.includes('TW')) || voices[0];
  if (zhVoice) utter.voice = zhVoice;
  window.speechSynthesis.speak(utter);
}

function submitExam() {
  const sName = document.getElementById('studentName').value.trim() || '未填寫姓名';
  let totalCorrect = 0;
  const allQs = [...vocabQuestions, ...grammarQuestions];

  allQs.forEach(q => {
    if (userAnswers[q.id] === q.ans) {
      totalCorrect++;
    }
  });

  const finalScore = Math.round((totalCorrect / allQs.length) * 100);
  document.getElementById('scoreText').innerText = finalScore;
  document.getElementById('scoreBanner').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  const payload = {
    unit: '國三 L2 外送生活與情緒形容詞',
    level: 'C1 基礎組',
    name: sName,
    score: finalScore,
    totalQuestions: allQs.length,
    correctCount: totalCorrect,
    timestamp: new Date().toISOString()
  };

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('syncStatus').innerText = '✅ 成績已成功記錄並同步至教師雲端後台！';
  }).catch(() => {
    document.getElementById('syncStatus').innerText = '⚠️ 成績已完成評分（雲端同步已排程）。';
  });
}

window.onload = () => {
  initQuestions();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
  }
};
</script>
