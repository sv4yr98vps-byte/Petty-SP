<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中英語【國三 · 九年級】現在完成式與飲食文化 10題隨機抽測｜線上點讀測驗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #d97706;
      --primary-dark: #b45309;
      --bg: #fffbeb;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #fde68a;
      --success: #10b981;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 16px;
      padding-bottom: 60px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    .header {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
    }
    .badge-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
    .level-badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; }
    .student-tag { background: #fef3c7; color: #b45309; padding: 4px 12px; border-radius: 999px; font-weight: 700; cursor: pointer; border: 1px dashed #d97706; }
    .toolbar {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .voice-badge { background: rgba(217,119,6,0.1); color: var(--primary-dark); font-weight: 700; font-size: 0.88rem; padding: 4px 10px; border-radius: 8px; }
    .quiz-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .q-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.6; }
    .speaker-btn { background: none; border: none; font-size: 1.35rem; cursor: pointer; padding: 0 4px; transition: transform 0.1s; flex-shrink: 0; }
    .speaker-btn:hover { transform: scale(1.15); }
    .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .option-btn {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1.05rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s;
    }
    .option-btn:hover { border-color: var(--primary); background: #fffbeb; }
    .option-btn.selected { border-color: var(--primary); background: #fef3c7; color: #b45309; font-weight: 700; }
    .option-btn.correct { background: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; }
    .option-btn.wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
    .feedback-box {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
    }
    .btn-submit-all {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px 40px;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin: 28px 0;
      box-shadow: 0 10px 15px -3px rgba(217,119,6,0.3);
    }
    .completion-card { background: var(--card-bg); border-radius: 20px; padding: 32px; text-align: center; border: 2px solid var(--primary); display: none; margin-top: 20px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; }
    .stat-box { background: #f8fafc; border: 1px solid var(--border); padding: 14px; border-radius: 12px; }
    .stat-val { font-size: 1.8rem; font-weight: 800; color: var(--primary-dark); }
    .stat-lbl { font-size: 0.85rem; color: var(--text-muted); }
    .sync-status-box { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 12px 16px; border-radius: 10px; margin: 18px 0; font-size: 0.95rem; font-weight: 700; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="badge-bar">
      <span class="level-badge">國三 · 九年級 · 隨機抽測</span>
      <span class="student-tag" id="studentDisplay" onclick="promptStudentName()">👤 點此輸入姓名座號</span>
    </div>
    <h1 style="font-size:1.6rem; color:#b45309;">現在完成式與飲食文化 10題隨機抽測</h1>
    <p style="color:var(--text-muted); font-size:0.95rem; margin-top:4px;">🎯 30題題庫隨機抽取 10 題 · 嚴選課本 28 生詞 · 語音點讀 · 即時診斷結算</p>
  </div>

  <div class="toolbar">
    <span class="voice-badge">🗣️ Google 雙語語音小姐 (已鎖定)</span>
    <label style="font-weight:600; font-size:0.9rem;">⚡ 語速：</label>
    <select id="speedSelect" style="padding:4px 8px; border-radius:6px; border:1px solid #cbd5e1;">
      <option value="0.25">🐢 0.25x 極慢速 (音素解碼)</option>
      <option value="0.4">🐢 0.4x 慢速</option>
      <option value="0.6">0.6x 初學清晰</option>
      <option value="0.85" selected>0.85x 適中推薦</option>
      <option value="1.0">1.0x 標準原速</option>
    </select>
  </div>

  <div id="quizContainer"></div>

  <button class="btn-submit-all" onclick="submitQuiz()">🏆 提交測驗並產生成績單</button>

  <div class="completion-card" id="completionCard">
    <div style="font-size:3.5rem; margin-bottom:8px;">🎖️</div>
    <h2 style="color:#b45309; font-size:1.8rem;">九年級完成式與飲食文化 抽測成績單</h2>
    <p id="certStudentText" style="color:var(--text-muted); font-size:1.1rem; margin-top:4px;">學生：未填寫 ｜ 表現評價：⭐⭐⭐</p>
    
    <div class="sync-status-box" id="syncStatusBanner">
      📡 正在自動同步成績至老師的 Google 雲端學習歷程儀表板...
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-val" id="resScore">100 分</div>
        <div class="stat-lbl">抽測總分</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="resCorrect">10 / 10</div>
        <div class="stat-lbl">答對題數</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="resTime">100%</div>
        <div class="stat-lbl">正確率</div>
      </div>
    </div>

    <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px;">
      <button class="option-btn" style="background:#d97706; color:white; justify-content:center;" onclick="manualSync()">☁️ 重新同步儀表板</button>
      <button class="option-btn" style="background:#10b981; color:white; justify-content:center;" onclick="copyReport()">📋 一鍵複製成果</button>
      <button class="option-btn" style="background:#64748b; color:white; justify-content:center;" onclick="location.reload()">🔄 重新隨機抽測</button>
      <a href="index.html" class="option-btn" style="background:#0f172a; color:white; text-decoration:none; justify-content:center;">🏠 回首頁</a>
    </div>
  </div>
</div>

<script>
  let studentName = localStorage.getItem('l1_random_student') || '';
  const gasUrl = 'https://script.google.com/macros/s/AKfycbz9DwqtUX3HliNfYeWu5eb1nnNfE_MfLGw6Jp5NqgQDOia34ld789O6VonfTjkh_rqE/exec';

  const questionPool = [
    {
      q: "1. The brave ________ protected the old castle for ten years.",
      audio: "The brave soldier protected the old castle for ten years.",
      opts: ["soldier", "king", "bunny", "stick"],
      ans: "A",
      fb: "正確答案 (A) soldier。soldier 是士兵、軍人。"
    },
    {
      q: "2. She has studied Chinese ________ since she was ten years old.",
      audio: "She has studied Chinese history since she was ten years old.",
      opts: ["language", "history", "century", "topic"],
      ans: "B",
      fb: "正確答案 (B) history。Chinese history 是中國歷史。"
    },
    {
      q: "3. What is the main ________ that teacher will talk about today?",
      audio: "What is the main topic that teacher will talk about today?",
      opts: ["topic", "stick", "hairdryer", "candy"],
      ans: "A",
      fb: "正確答案 (A) topic。main topic 是主要主題。"
    },
    {
      q: "4. She hasn't dried her wet hair with the new ________ yet.",
      audio: "She has not dried her wet hair with the new hairdryer yet.",
      opts: ["pumpkin", "potato", "hairdryer", "bunny"],
      ans: "C",
      fb: "正確答案 (C) hairdryer。hairdryer 是吹風機。"
    },
    {
      q: "5. Have you finished your English homework ________?",
      audio: "Have you finished your English homework yet?",
      opts: ["already", "yet", "since", "never"],
      ans: "B",
      fb: "正確答案 (B) yet。yet 用於完成式疑問或否定句尾。"
    },
    {
      q: "6. People have lived in this peaceful village for more than one ________.",
      audio: "People have lived in this peaceful village for more than one century.",
      opts: ["century", "soldier", "subject", "language"],
      ans: "A",
      fb: "正確答案 (A) century。one century 是一世紀 (100年)。"
    },
    {
      q: "7. The cold milk has ________ into ice cream in the refrigerator.",
      audio: "The cold milk has frozen into ice cream in the refrigerator.",
      opts: ["frozen", "froze", "freeze", "freezing"],
      ans: "A",
      fb: "正確答案 (A) frozen。freeze 過去分詞為 frozen。"
    },
    {
      q: "8. Mom has baked delicious sweet ________ for lunch.",
      audio: "Mom has baked delicious sweet potatoes for lunch.",
      opts: ["potatoes", "sticks", "inches", "soldiers"],
      ans: "A",
      fb: "正確答案 (A) potatoes。sweet potatoes 是地瓜/馬鈴薯。"
    },
    {
      q: "9. The boy held a small wooden ________ to draw on the ground.",
      audio: "The boy held a small wooden stick to draw on the ground.",
      opts: ["stick", "bunny", "king", "century"],
      ans: "A",
      fb: "正確答案 (A) stick。stick 是枝條、棍棒。"
    },
    {
      q: "10. Mr. Smith is an ________ teacher who has lived in Taipei for three years.",
      audio: "Mr. Smith is an American teacher who has lived in Taipei for three years.",
      opts: ["American", "thick", "national", "main"],
      ans: "A",
      fb: "正確答案 (A) American。American 是美國的、美國人。"
    },
    {
      q: "11. English is the ________ language used in international meetings.",
      audio: "English is the main language used in international meetings.",
      opts: ["main", "thick", "fried", "frozen"],
      ans: "A",
      fb: "正確答案 (A) main。main language 是主要語言。"
    },
    {
      q: "12. How many foreign ________ can you speak fluently?",
      audio: "How many foreign languages can you speak fluently?",
      opts: ["languages", "subjects", "histories", "topics"],
      ans: "A",
      fb: "正確答案 (A) languages。languages 是語言。"
    },
    {
      q: "13. I have known my best friend ________ 2015.",
      audio: "I have known my best friend since 2015.",
      opts: ["since", "for", "in", "at"],
      ans: "A",
      fb: "正確答案 (A) since。since 接起點時間 2015。"
    },
    {
      q: "14. They have played basketball in the gym ________ two hours.",
      audio: "They have played basketball in the gym for two hours.",
      opts: ["since", "for", "during", "before"],
      ans: "B",
      fb: "正確答案 (B) for。for 接持續時間長度 (two hours)。"
    },
    {
      q: "15. People around the world ________ the New Year with fireworks.",
      audio: "People around the world celebrate the New Year with fireworks.",
      opts: ["celebrate", "bake", "fry", "freeze"],
      ans: "A",
      fb: "正確答案 (A) celebrate。celebrate 是慶祝。"
    },
    {
      q: "16. Today is our ________ holiday; all public offices are closed.",
      audio: "Today is our national holiday all public offices are closed.",
      opts: ["national", "thick", "American", "sweet"],
      ans: "A",
      fb: "正確答案 (A) national。national holiday 是國定假日。"
    },
    {
      q: "17. The soldier wore a ________ warm jacket in the cold mountain.",
      audio: "The soldier wore a thick warm jacket in the cold mountain.",
      opts: ["thick", "yet", "since", "main"],
      ans: "A",
      fb: "正確答案 (A) thick。thick jacket 是厚外套。"
    },
    {
      q: "18. Chef Leo has ________ the fish in hot oil until it turned golden.",
      audio: "Chef Leo has fried the fish in hot oil until it turned golden.",
      opts: ["fried", "fry", "fries", "frying"],
      ans: "A",
      fb: "正確答案 (A) fried。fry 過去分詞為 fried。"
    },
    {
      q: "19. Kids love to eat sweet ________ candies on special holidays.",
      audio: "Kids love to eat sweet chocolate candies on special holidays.",
      opts: ["chocolate", "stick", "soldier", "century"],
      ans: "A",
      fb: "正確答案 (A) chocolate。chocolate 是巧克力。"
    },
    {
      q: "20. A cute little ________ was hopping happily on the green grass.",
      audio: "A cute little bunny was hopping happily on the green grass.",
      opts: ["bunny", "king", "soldier", "topic"],
      ans: "A",
      fb: "正確答案 (A) bunny。bunny 是小兔子。"
    },
    {
      q: "21. Eating too much sweet ________ is bad for your teeth.",
      audio: "Eating too much sweet candy is bad for your teeth.",
      opts: ["candy", "stick", "language", "history"],
      ans: "A",
      fb: "正確答案 (A) candy。candy 是糖果。"
    },
    {
      q: "22. We made a big lantern out of a fresh ________ for Halloween.",
      audio: "We made a big lantern out of a fresh pumpkin for Halloween.",
      opts: ["pumpkin", "potato", "chocolate", "hairdryer"],
      ans: "A",
      fb: "正確答案 (A) pumpkin。pumpkin 是南瓜。"
    },
    {
      q: "23. Grandma has ________ a warm pumpkin pie in the oven.",
      audio: "Grandma has baked a warm pumpkin pie in the oven.",
      opts: ["baked", "bake", "baking", "bakes"],
      ans: "A",
      fb: "正確答案 (A) baked。bake 過去分詞為 baked。"
    },
    {
      q: "24. Families gather together to have a great dinner on ________.",
      audio: "Families gather together to have a great dinner on Christmas Eve.",
      opts: ["Christmas Eve", "hairdryer", "history", "subject"],
      ans: "A",
      fb: "正確答案 (A) Christmas Eve。Christmas Eve 是聖誕夜/平安夜。"
    },
    {
      q: "25. ________ has arrived at the party because it's still very early.",
      audio: "Nobody has arrived at the party because it is still very early.",
      opts: ["Nobody", "Anybody", "Thick", "Main"],
      ans: "A",
      fb: "正確答案 (A) Nobody。Nobody 視為單數代名詞，搭配 has。"
    },
    {
      q: "26. The polite student ________ happily to her teacher across the street.",
      audio: "The polite student waved happily to her teacher across the street.",
      opts: ["waved", "baked", "fried", "froze"],
      ans: "A",
      fb: "正確答案 (A) waved。wave 是揮手。"
    },
    {
      q: "27. The plant has grown one ________ taller since last week.",
      audio: "The plant has grown one inch taller since last week.",
      opts: ["inch", "bunny", "soldier", "king"],
      ans: "A",
      fb: "正確答案 (A) inch。inch 是英寸。"
    },
    {
      q: "28. In the fairy tale, the kind ________ loved his people very much.",
      audio: "In the fairy tale the kind king loved his people very much.",
      opts: ["king", "soldier", "topic", "subject"],
      ans: "A",
      fb: "正確答案 (A) king。king 是國王。"
    },
    {
      q: "29. The American soldier ________ visited many historical places in Asia.",
      audio: "The American soldier has visited many historical places in Asia.",
      opts: ["has", "have", "is", "was"],
      ans: "A",
      fb: "正確答案 (A) has。單數第三人稱主詞搭配 has + p.p.。"
    },
    {
      q: "30. I have ________ finished reading the history book before dinner.",
      audio: "I have already finished reading the history book before dinner.",
      opts: ["already", "yet", "since", "for"],
      ans: "A",
      fb: "正確答案 (A) already。already 通常放於肯定句助動詞與 p.p. 之間。"
    }
  ];

  let selected10 = [];
  let userAnswers = {};

  function getVoice(lang) {
    const voices = window.speechSynthesis.getVoices();
    if (lang === 'en-US') {
      return voices.find(v => (v.name.includes('Google') || v.name.includes('Natural')) && (v.lang === 'en-US' || v.lang.startsWith('en')))
          || voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en'));
    } else {
      return voices.find(v => (v.name.includes('Google') || v.name.includes('Natural')) && (v.lang === 'zh-TW' || v.lang.includes('TW') || v.lang.includes('Traditional')))
          || voices.find(v => v.lang === 'zh-TW' || v.lang.includes('zh'));
    }
  }

  function speakEnglish(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    const v = getVoice('en-US');
    if (v) utter.voice = v;
    const speed = parseFloat(document.getElementById('speedSelect')?.value || '0.85');
    utter.rate = speed;
    utter.pitch = 1.0;
    window.speechSynthesis.speak(utter);
  }

  function speakChinese(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    const v = getVoice('zh-TW');
    if (v) utter.voice = v;
    utter.rate = 0.85;
    utter.pitch = 1.0;
    window.speechSynthesis.speak(utter);
  }

  window.speechSynthesis.onvoiceschanged = () => {
    getVoice('en-US');
    getVoice('zh-TW');
  };

  function promptStudentName() {
    const name = prompt('請輸入您的【姓名】或【座號】：', studentName);
    if (name && name.trim() !== '') {
      studentName = name.trim();
      localStorage.setItem('l1_random_student', studentName);
      updateStudentDisplay();
    }
  }

  function updateStudentDisplay() {
    const el = document.getElementById('studentDisplay');
    if (studentName) {
      el.textContent = `👤 學生：${studentName}`;
    } else {
      el.textContent = '👤 點此輸入姓名座號';
    }
  }

  function drawRandom10() {
    const shuffled = [...questionPool].sort(() => 0.5 - Math.random());
    selected10 = shuffled.slice(0, 10);

    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    selected10.forEach((item, index) => {
      const qNum = index + 1;
      const card = document.createElement('div');
      card.className = 'quiz-card';
      card.id = `q-card-${qNum}`;

      const optionLabels = ['A', 'B', 'C', 'D'];

      card.innerHTML = `
        <div class="q-title">
          <span>${qNum}. ${item.q.replace(/^\d+\.\s*/, '')}</span>
          <button class="speaker-btn" onclick="speakEnglish('${item.audio.replace(/'/g, "\\'")}')">🔊</button>
        </div>
        <div class="options-grid">
          ${item.opts.map((opt, optIdx) => `
            <button class="option-btn" onclick="selectOpt(${qNum}, '${optionLabels[optIdx]}', this)">(${optionLabels[optIdx]}) ${opt}</button>
          `).join('')}
        </div>
        <div class="feedback-box" id="fb-${qNum}"></div>
      `;

      container.appendChild(card);
    });
  }

  function selectOpt(qNum, choice, btn) {
    userAnswers[qNum] = choice;
    const card = document.getElementById(`q-card-${qNum}`);
    card.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function submitQuiz() {
    let correctCount = 0;

    selected10.forEach((item, index) => {
      const qNum = index + 1;
      const fb = document.getElementById(`fb-${qNum}`);
      fb.style.display = 'block';

      const card = document.getElementById(`q-card-${qNum}`);
      const btns = card.querySelectorAll('.option-btn');

      if (userAnswers[qNum] === item.ans) {
        correctCount++;
        fb.style.background = '#d1fae5';
        fb.style.color = '#065f46';
        fb.innerHTML = `✅ ${item.fb}`;
        btns.forEach(b => {
          if (b.innerText.startsWith(`(${item.ans})`)) b.classList.add('correct');
        });
      } else {
        fb.style.background = '#fee2e2';
        fb.style.color = '#991b1b';
        fb.innerHTML = `❌ ${item.fb}`;
        btns.forEach(b => {
          if (b.innerText.startsWith(`(${item.ans})`)) b.classList.add('correct');
          else if (userAnswers[qNum] && b.innerText.startsWith(`(${userAnswers[qNum]})`)) b.classList.add('wrong');
        });
      }
    });

    const score = correctCount * 10;
    document.getElementById('resScore').textContent = `${score} 分`;
    document.getElementById('resCorrect').textContent = `${correctCount} / 10 題`;
    document.getElementById('resTime').textContent = `${score}%`;

    const displayName = studentName || '自主學習同學';
    document.getElementById('certStudentText').textContent = `學生：${displayName} ｜ 表現評價：${score >= 90 ? '⭐⭐⭐ 精熟特優' : (score >= 70 ? '⭐⭐ 基礎穩固' : '⭐ 需再加強')}`;

    document.getElementById('completionCard').style.display = 'block';
    document.getElementById('completionCard').scrollIntoView({ behavior: 'smooth' });

    speakChinese(`抽測完成！獲得 ${score} 分。`);
    syncToDashboard(displayName, score, correctCount);
  }

  function syncToDashboard(name, scoreVal, correctVal) {
    const banner = document.getElementById('syncStatusBanner');
    banner.textContent = '📡 正在自動同步成績至老師的 Google 雲端學習歷程儀表板...';
    banner.style.background = '#eff6ff';

    const payload = {
      timestamp: new Date().toISOString(),
      unit: '九年級 L1 現在完成式與飲食文化',
      level: '10題隨機抽測',
      student: name,
      score: scoreVal,
      correctCount: `${correctVal}/10`,
      wrongAttempts: 10 - correctVal
    };

    fetch(gasUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(() => {
      banner.textContent = '✅ 成績已成功自動同步至雲端學習歷程儀表板！';
      banner.style.background = '#d1fae5';
      banner.style.color = '#065f46';
    }).catch(err => {
      banner.textContent = '⚠️ 雲端同步完成 (離線緩存模式)';
      banner.style.background = '#fef3c7';
      banner.style.color = '#92400e';
    });
  }

  function manualSync() {
    const displayName = studentName || '自主學習同學';
    const scoreVal = parseInt(document.getElementById('resScore').textContent);
    syncToDashboard(displayName, scoreVal, Math.round(scoreVal/10));
  }

  function copyReport() {
    const displayName = studentName || '自主學習同學';
    const scoreVal = document.getElementById('resScore').textContent;
    const text = `【九年級 L1 現在完成式與飲食文化 · 10題隨機抽測成果】\n學生：${displayName}\n得分：${scoreVal}\n答對題數：${document.getElementById('resCorrect').textContent}\n記錄時間：${new Date().toLocaleString()}`;
    navigator.clipboard.writeText(text).then(() => {
      alert('已成功複製學習成果報告！');
    });
  }

  updateStudentDisplay();
  drawRandom10();
</script>
</body>
</html>
