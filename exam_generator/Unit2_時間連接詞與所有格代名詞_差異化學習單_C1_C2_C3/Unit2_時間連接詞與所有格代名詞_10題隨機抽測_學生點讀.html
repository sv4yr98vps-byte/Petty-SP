<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中英語【國二 · 八年級】Unit 2 時間連接詞與所有格代名詞｜10 題隨機抽測點讀卷</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #eff6ff;
      --card-bg: #ffffff;
      --text: #1e3a8a;
      --text-muted: #64748b;
      --border: #bfdbfe;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(37,99,235,0.15);
    }

    header h1 { font-size: 1.65rem; margin-bottom: 6px; font-weight: 700; }
    header p { font-size: 0.95rem; opacity: 0.95; }

    .container {
      max-width: 820px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .info-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .input-name {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .voice-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .voice-ctrl select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: inherit;
    }

    .speed-btn {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 2px 6px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 4px;
    }
    .speed-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .q-prompt {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .tts-btn {
      background: #dbeafe;
      color: #1e40af;
      border: none;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
      flex-shrink: 0;
      margin-left: 10px;
    }

    .tts-btn:hover { background: #bfdbfe; }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .opt-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .opt-btn:hover {
      background: #f1f5f9;
      border-color: #93c5fd;
    }

    .opt-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
      font-weight: bold;
    }

    .opt-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    .explanation {
      margin-top: 12px;
      padding: 10px 14px;
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
    }

    .submit-bar {
      margin-top: 30px;
      text-align: center;
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 36px;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37,99,235,0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .score-banner {
      display: none;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-top: 25px;
      animation: fadeIn 0.4s ease;
    }

    .score-banner h2 { font-size: 1.8rem; color: var(--primary); margin-bottom: 8px; }
    .score-banner p { font-size: 1.05rem; color: var(--text-muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<header>
  <h1>國中英語【國二 · 八年級】Unit 2 時間連接詞與所有格代名詞</h1>
  <p>🎲 10 題隨機抽測點讀卷（從 30 題核心大題庫隨機抽取 · 真實計分）</p>
</header>

<div class="container">
  <div class="info-bar">
    <div>
      <label>學生姓名：</label>
      <input type="text" id="studentName" class="input-name" placeholder="請輸入姓名">
    </div>
    <div class="voice-ctrl">
      <label>🔊 朗讀語音：</label>
      <select id="voiceSelect"></select>
      <span>語速:</span>
      <button type="button" class="speed-btn" onclick="setSpeed(1.0, this)">1x</button>
      <button type="button" class="speed-btn" onclick="setSpeed(0.75, this)">0.75x</button>
      <button type="button" class="speed-btn" onclick="setSpeed(0.5, this)">0.5x</button>
      <button type="button" class="speed-btn active" onclick="setSpeed(0.25, this)">0.25x</button>
    </div>
  </div>

  <div id="quiz-container"></div>

  <div class="submit-bar">
    <button class="btn-submit" onclick="submitExam()">送出答案並查看成績</button>
    <button class="btn-submit" onclick="location.reload()" style="background:#64748b; margin-left:12px;">🎲 換一組題目</button>
  </div>

  <div class="score-banner" id="scoreBanner">
    <h2>🎉 測驗完成！得分：<span id="scoreText">0</span> / 100</h2>
    <p id="syncStatus">正在同步成績至雲端學習歷程資料庫...</p>
  </div>
</div>

<script>
let currentSpeed = 0.25;
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz9DwqtUX3HliNfYeWu5eb1nnNfE_MfLGw6Jp5NqgQDOia34ld789O6VonfTjkh_rqE/exec';

// 30-Question Bank
const questionBank = [
  { prompt: 'Yuki decided to join the water sports _______.', tts: 'Yuki decided to join the water sports club.', options: ['club', 'subject', 'camera', 'sandwich'], ans: 0, exp: 'water sports club 代表水上運動社團。' },
  { prompt: 'Computer science is very _______ to Cody. He wants to design video games.', tts: 'Computer science is very interesting to Cody.', options: ['poor', 'interesting', 'wrong', 'same'], ans: 1, exp: 'interesting 代表有趣的。' },
  { prompt: 'A: May I speak to Meg, please? - B: Yes, please _______.', tts: 'May I speak to Meg, please? Yes, please hold on.', options: ['look for', 'hold on', 'sign up', 'pull leg'], ans: 1, exp: 'Please hold on. 代表請稍候。' },
  { prompt: 'Sorry, you have the _______ number. Nobody named Marsha lives here.', tts: 'Sorry, you have the wrong number.', options: ['wrong', 'same', 'interesting', 'poor'], ans: 0, exp: 'wrong number 代表撥錯電話。' },
  { prompt: '_______ camera is this on the table? - It\'s mine.', tts: 'Whose camera is this on the table? It is mine.', options: ['Whose', 'Where', 'When', 'Who'], ans: 0, exp: 'Whose 詢問誰的。' },
  { prompt: 'Computer _______ is Cody\'s favorite subject.', tts: 'Computer science is Cody\'s favorite subject.', options: ['club', 'science', 'camera', 'violin'], ans: 1, exp: 'computer science 電腦科學。' },
  { prompt: 'Shin _______ Yuki about the water sports club yesterday.', tts: 'Shin told Yuki about the water sports club yesterday.', options: ['heard', 'called', 'told', 'signed'], ans: 2, exp: 'tell sb about sth 過去式為 told。' },
  { prompt: 'Shin was a _______ swimmer last year, but now he swims like a fish.', tts: 'Shin was a poor swimmer last year.', options: ['same', 'wrong', 'poor', 'cute'], ans: 2, exp: 'poor swimmer 拙劣的泳者。' },
  { prompt: 'This sandwich is _______ (my sandwich), not yours.', tts: 'This sandwich is mine, not yours.', options: ['mine', 'my', 'me', 'myself'], ans: 0, exp: 'mine 代表 my sandwich。' },
  { prompt: 'This car is not his; it\'s _______ (that girl\'s car).', tts: 'This car is not his; it is hers.', options: ['her', 'hers', 'she', 'him'], ans: 1, exp: 'hers 代表 that girl\'s car。' },
  { prompt: 'These jackets are _______ (their jackets). Ours are over there.', tts: 'These jackets are theirs.', options: ['their', 'theirs', 'them', 'they'], ans: 1, exp: 'theirs 代表 their jackets。' },
  { prompt: 'Allan: Look at the basketballs. Whose are they? - Betty: They are _______.', tts: 'Look at the basketballs. Whose are they? They are those girls\'.', options: ['those girls\'', 'those girl\'s', 'those girls', 'them girls'], ans: 0, exp: '複數所有格代名詞為 those girls\'。' },
  { prompt: '_______ Miss Turner went to work, she bought a sandwich.', tts: 'Before Miss Turner went to work, she bought a sandwich.', options: ['Before', 'Whose', 'Mine', 'During'], ans: 0, exp: 'Before 引導時間副詞子句。' },
  { prompt: 'Alan made his bed _______ he got up this morning.', tts: 'Alan made his bed after he got up this morning.', options: ['after', 'whose', 'or', 'so'], ans: 0, exp: 'after 在...之後。' },
  { prompt: '_______ Zoey has free time, she practices soccer.', tts: 'When Zoey has free time, she practices soccer.', options: ['When', 'Whose', 'Mine', 'Where'], ans: 0, exp: 'When 當...的時候。' },
  { prompt: 'Mollie practiced the violin _______ she had lunch.', tts: 'Mollie practiced the violin before she had lunch.', options: ['before', 'before,', ', before', 'whose'], ans: 0, exp: '連接詞放句中不需逗號。' },
  { prompt: 'Cody: Hello, this is Cody. May I speak to Yuki? - Yuki: _______', tts: 'Speaking. What is up?', options: ['Speaking.', 'Yes, you are.', 'I am speaking Yuki.', 'Yuki speaks.'], ans: 0, exp: 'Speaking. 代表我就是。' },
  { prompt: 'Shin was a poor swimmer _______ he joined the club.', tts: 'Shin was a poor swimmer before he joined the club.', options: ['before', 'after', 'whose', 'so'], ans: 0, exp: 'before he joined 在加入之前。' },
  { prompt: 'Megan studied Chinese after she _______ her math homework.', tts: 'Megan studied Chinese after she did her math homework.', options: ['did', 'does', 'doing', 'is doing'], ans: 0, exp: '過去式時態呼應 did。' },
  { prompt: 'When the weather is hot, the kids _______ ice cream.', tts: 'When the weather is hot, the kids eat ice cream.', options: ['eat', 'ate', 'eating', 'to eat'], ans: 0, exp: '現在式習慣用法 eat。' },
  { prompt: 'Are you pulling my _______? You can\'t swim!', tts: 'Are you pulling my leg?', options: ['leg', 'arm', 'hand', 'head'], ans: 0, exp: 'pull one\'s leg 開玩笑。' },
  { prompt: 'I can\'t make up my _______ because all the clubs are interesting.', tts: 'I cannot make up my mind.', options: ['mind', 'head', 'hand', 'heart'], ans: 0, exp: 'make up one\'s mind 下定決心。' },
  { prompt: 'I _______ (sign up) for the water sports club yesterday.', tts: 'I signed up for the water sports club yesterday.', options: ['signed up', 'sign up', 'signing up', 'signs up'], ans: 0, exp: 'yesterday 過去式 signed up。' },
  { prompt: 'Can I think about it and _______ you back later?', tts: 'Can I think about it and call you back later?', options: ['call', 'calling', 'called', 'calls'], ans: 0, exp: 'can 助動詞後接原形動詞 call。' },
  { prompt: 'At the _______ of the year, Shin could swim like a fish.', tts: 'At the end of the year, Shin could swim like a fish.', options: ['end', 'start', 'wrong', 'camera'], ans: 0, exp: 'at the end of the year 年底時。' },
  { prompt: 'By the way, whose camera is this? - It\'s _______ (my camera).', tts: 'By the way, whose camera is this? It is mine.', options: ['mine', 'my', 'me', 'myself'], ans: 0, exp: 'mine 代表 my camera。' },
  { prompt: 'These basketballs are not ours; they are _______ (Karen\'s basketballs).', tts: 'These basketballs are not ours; they are Karen\'s.', options: ['Karen\'s', 'Karens\'', 'Karen', 'she'], ans: 0, exp: 'Karen\'s 代表 Karen\'s basketballs。' },
  { prompt: '_______ Dylan was at the airport, he called his parents.', tts: 'When Dylan was at the airport, he called his parents.', options: ['When', 'Whose', 'Mine', 'Which'], ans: 0, exp: 'When 當...的時候。' },
  { prompt: 'What do the kids always do _______ they go to bed? - They drink milk.', tts: 'What do the kids always do before they go to bed?', options: ['before', 'whose', 'mine', 'which'], ans: 0, exp: 'before they go to bed 睡前。' },
  { prompt: 'Carol listens to music _______ she reads books.', tts: 'Carol listens to music when she reads books.', options: ['when', 'whose', 'mine', 'which'], ans: 0, exp: 'when she reads 讀書的時候。' }
];

let selectedQuestions = [];
let userAnswers = {};

function initRandomQuiz() {
  const shuffled = [...questionBank].sort(() => 0.5 - Math.random());
  selectedQuestions = shuffled.slice(0, 10);

  const container = document.getElementById('quiz-container');
  selectedQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'card-' + idx;

    const promptDiv = document.createElement('div');
    promptDiv.className = 'q-prompt';
    promptDiv.innerHTML = `<div><strong>第 ${idx + 1} 題：</strong>${q.prompt}</div>`;

    const ttsBtn = document.createElement('button');
    ttsBtn.className = 'tts-btn';
    ttsBtn.innerHTML = '🔊 點讀';
    ttsBtn.onclick = () => speak(q.tts);
    promptDiv.appendChild(ttsBtn);
    card.appendChild(promptDiv);

    const grid = document.createElement('div');
    grid.className = 'options-grid';

    q.options.forEach((opt, oIdx) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<strong>(${String.fromCharCode(65 + oIdx)})</strong> ${opt}`;
      btn.onclick = () => selectOption(idx, oIdx, q.ans);
      btn.id = `btn-${idx}-${oIdx}`;
      grid.appendChild(btn);
    });

    card.appendChild(grid);

    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.id = 'exp-' + idx;
    exp.innerHTML = `【解析】${q.exp}`;
    card.appendChild(exp);

    container.appendChild(card);
  });
}

function selectOption(qIdx, selectedIdx, correctIdx) {
  userAnswers[qIdx] = selectedIdx;
  const isCorrect = (selectedIdx === correctIdx);
  const card = document.getElementById('card-' + qIdx);
  const btns = card.querySelectorAll('.opt-btn');
  
  btns.forEach((btn, idx) => {
    btn.classList.remove('correct', 'wrong');
    if (idx === selectedIdx) {
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });

  document.getElementById('exp-' + qIdx).style.display = 'block';
}

function setSpeed(speed, btn) {
  currentSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = currentSpeed;

  const voiceSelect = document.getElementById('voiceSelect');
  const voices = window.speechSynthesis.getVoices();
  if (voiceSelect && voiceSelect.value !== '') {
    utter.voice = voices[voiceSelect.value];
  }
  window.speechSynthesis.speak(utter);
}

function initVoices() {
  const voiceSelect = document.getElementById('voiceSelect');
  const voices = window.speechSynthesis.getVoices();
  voiceSelect.innerHTML = '';
  
  let targetIdx = -1;
  voices.forEach((v, idx) => {
    if (v.lang.startsWith('en')) {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
      if (targetIdx === -1 && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('US'))) {
        targetIdx = voiceSelect.options.length - 1;
      }
    }
  });

  if (targetIdx !== -1) {
    voiceSelect.selectedIndex = targetIdx;
  }
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = initVoices;
}

function submitExam() {
  const sName = document.getElementById('studentName').value.trim() || '未填寫姓名';
  let totalCorrect = 0;

  selectedQuestions.forEach((q, idx) => {
    if (userAnswers[q.id] === q.ans || userAnswers[idx] === q.ans) {
      totalCorrect++;
    }
    document.getElementById('exp-' + idx).style.display = 'block';
  });

  const finalScore = totalCorrect * 10;
  document.getElementById('scoreText').innerText = finalScore;
  document.getElementById('scoreBanner').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  // Sync to GAS
  const payload = {
    unit: '國二 Unit 2 時間連接詞與所有格代名詞',
    level: '10題隨機抽測',
    name: sName,
    score: finalScore,
    totalQuestions: 10,
    correctCount: totalCorrect,
    timestamp: new Date().toISOString()
  };

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('syncStatus').innerText = '✅ 成績已成功記錄並同步至教師雲端後台！';
  }).catch(() => {
    document.getElementById('syncStatus').innerText = '⚠️ 成績已完成評分（雲端同步已排程）。';
  });
}

window.onload = () => {
  initRandomQuiz();
  setTimeout(initVoices, 200);
};
</script>

</body>
</html>
