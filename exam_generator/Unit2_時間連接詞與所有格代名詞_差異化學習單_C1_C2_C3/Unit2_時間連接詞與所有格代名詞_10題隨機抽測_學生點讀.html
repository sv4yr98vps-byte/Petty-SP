let selectedQuestions = [];

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

      <span class="module-tag">第 ${idx + 1} 題 ｜ ${q.module}</span>
      <button type="button" class="speaker-btn" onclick="speakEnglish('${escapeQuotes(q.tts)}')">🔊 朗讀題目</button>
    `;
    card.appendChild(meta);

    const promptDiv = document.createElement('div');
    promptDiv.className = 'q-prompt';
    promptDiv.innerHTML = q.prompt;
    card.appendChild(promptDiv);

    const grid = document.createElement('div');
    grid.className = 'options-grid';

    q.options.forEach((opt, oIdx) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt-btn';
      btn.id = `btn-${idx}-${oIdx}`;
      btn.innerHTML = `<strong>(${String.fromCharCode(65 + oIdx)})</strong> ${opt}`;
      btn.onclick = () => selectOption(idx, oIdx, q.ans, q.exp);
      grid.appendChild(btn);
    });

    card.appendChild(grid);

    const fb = document.createElement('div');
    fb.className = 'feedback-box';
    fb.id = 'fb-' + idx;
    card.appendChild(fb);

    container.appendChild(card);
  });
}

function escapeQuotes(str) {
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function selectOption(qIdx, selectedIdx, correctIdx, expText) {
  userAnswers[qIdx] = selectedIdx;
  const isCorrect = (selectedIdx === correctIdx);
  const card = document.getElementById('card-' + qIdx);
  const btns = card.querySelectorAll('.opt-btn');

  btns.forEach((btn, i) => {
    btn.className = 'opt-btn';
    if (i === selectedIdx) {
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });

  const fb = document.getElementById('fb-' + qIdx);
  fb.style.display = 'block';
  if (isCorrect) {
    fb.style.background = '#dcfce7';
    fb.style.border = '1px solid #86efac';
    fb.style.color = '#15803d';
    fb.innerHTML = `<strong>✨ 答對了！</strong> ${expText}`;
    speakChinese('答對了！' + expText);
  } else {
    fb.style.background = '#fee2e2';
    fb.style.border = '1px solid #fca5a5';
    fb.style.color = '#b91c1c';
    fb.innerHTML = `<strong>❌ 再想想看：</strong> ${expText}`;
    speakChinese('再想想看：' + expText);
  }
}

function setSpeed(speed, btn) {
  currentSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function speakEnglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = currentSpeed;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && v.lang.includes('US')) ||
                  voices.find(v => v.lang.startsWith('en')) || voices[0];
  if (enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  utter.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && (v.lang.includes('zh') || v.lang.includes('TW'))) ||
                  voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('cmn-Hant-TW') || v.lang.includes('TW')) || voices[0];
  if (zhVoice) utter.voice = zhVoice;
  window.speechSynthesis.speak(utter);
}

function submitExam() {
  const sName = document.getElementById('studentName').value.trim() || '未填寫姓名';
  let totalCorrect = 0;

  selectedQuestions.forEach((q, idx) => {
    if (userAnswers[idx] === q.ans) {
      totalCorrect++;
    }
    const fb = document.getElementById('fb-' + idx);
    if (fb) fb.style.display = 'block';
  });

  const finalScore = totalCorrect * 10;
  document.getElementById('scoreText').innerText = finalScore;
  document.getElementById('scoreBanner').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  const payload = {
    unit: '國二 Unit 2 時間連接詞與所有格代名詞',
    level: '10題隨機抽測',
    name: sName,
    score: finalScore,
    totalQuestions: 10,
    correctCount: totalCorrect,
    timestamp: new Date().toISOString()
  };

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('syncStatus').innerText = '✅ 成績已成功記錄並同步至教師後台！';
  }).catch(() => {
    document.getElementById('syncStatus').innerText = '⚠️ 成績已計算（離線暫存模式）。';
  });
}

window.onload = () => {
  initRandomQuiz();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }
  }
};
</script>
