<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中英語【國二 · 八年級】Unit 2 時間連接詞與所有格代名詞 差異化學習單｜C1 基礎組</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --bg: #ecfdf5;
      --card-bg: #ffffff;
      --text: #064e3b;
      --text-muted: #64748b;
      --border: #a7f3d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(5,150,105,0.15);
    }

    header h1 { font-size: 1.65rem; margin-bottom: 6px; font-weight: 700; }
    header p { font-size: 0.95rem; opacity: 0.95; }

    .container {
      max-width: 820px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .info-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .input-name {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .voice-ctrl {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .voice-ctrl select {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: inherit;
    }

    .speed-btn {
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #cbd5e1;
      padding: 2px 6px;
      border-radius: 12px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 4px;
    }
    .speed-btn.active {
      background: #059669;
      color: white;
      border-color: #059669;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #065f46;
      margin: 24px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .q-prompt {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tts-btn {
      background: #e0f2fe;
      color: #0284c7;
      border: none;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .tts-btn:hover { background: #bae6fd; }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .opt-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 1rem;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .opt-btn:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .opt-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
      font-weight: bold;
    }

    .opt-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    .explanation {
      margin-top: 12px;
      padding: 10px 14px;
      background: #f0fdf4;
      border-left: 4px solid #22c55e;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
    }

    .submit-bar {
      margin-top: 30px;
      text-align: center;
    }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 36px;
      border-radius: 10px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(5,150,105,0.3);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .score-banner {
      display: none;
      background: #ffffff;
      border: 2px solid var(--primary);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-top: 25px;
      animation: fadeIn 0.4s ease;
    }

    .score-banner h2 { font-size: 1.8rem; color: var(--primary); margin-bottom: 8px; }
    .score-banner p { font-size: 1.05rem; color: var(--text-muted); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<header>
  <h1>國中英語【國二 · 八年級】Unit 2 時間連接詞與所有格代名詞</h1>
  <p>🎯 C1 基礎組：社團與電話生詞 4 選 1 ＋ 所有格代名詞與連接詞 3 選 1（共 15 題）</p>
</header>

<div class="container">
  <div class="info-bar">
    <div>
      <label>學生姓名：</label>
      <input type="text" id="studentName" class="input-name" placeholder="請輸入姓名">
    </div>
    <div class="voice-ctrl">
      <label>🔊 朗讀語音：</label>
      <select id="voiceSelect"></select>
      <span>語速:</span>
      <button type="button" class="speed-btn" onclick="setSpeed(1.0, this)">1x</button>
      <button type="button" class="speed-btn" onclick="setSpeed(0.75, this)">0.75x</button>
      <button type="button" class="speed-btn" onclick="setSpeed(0.5, this)">0.5x</button>
      <button type="button" class="speed-btn active" onclick="setSpeed(0.25, this)">0.25x</button>
    </div>
  </div>

  <div class="section-title">📌 第一部分：核心生詞與電話用語（8 題 · 4 選 1）</div>
  <div id="vocab-container"></div>

  <div class="section-title">📌 第二部分：所有格代名詞與時間連接詞（7 題 · 3 選 1）</div>
  <div id="grammar-container"></div>

  <div class="submit-bar">
    <button class="btn-submit" onclick="submitExam()">送出答案並計分</button>
  </div>

  <div class="score-banner" id="scoreBanner">
    <h2>🎉 測驗完成！得分：<span id="scoreText">0</span> / 100</h2>
    <p id="syncStatus">正在同步成績至雲端學習歷程資料庫...</p>
  </div>
</div>

<script>
let currentSpeed = 0.25;
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz9DwqtUX3HliNfYeWu5eb1nnNfE_MfLGw6Jp5NqgQDOia34ld789O6VonfTjkh_rqE/exec';

const vocabQuestions = [
  {
    id: 'v1',
    prompt: '1. Yuki decided to join the water sports _______.',
    tts: 'Yuki decided to join the water sports club.',
    options: ['club', 'subject', 'camera', 'sandwich'],
    ans: 0,
    exp: '【解析】water sports club 代表「水上運動社團」。'
  },
  {
    id: 'v2',
    prompt: '2. Computer science is very _______ to Cody. He likes it.',
    tts: 'Computer science is very interesting to Cody. He likes it.',
    options: ['poor', 'interesting', 'wrong', 'same'],
    ans: 1,
    exp: '【解析】interesting 表「有趣的」。電腦科學對 Cody 來說很有趣。'
  },
  {
    id: 'v3',
    prompt: '3. A: May I speak to Meg, please? - B: Yes, please _______.',
    tts: 'May I speak to Meg, please? Yes, please hold on.',
    options: ['look for', 'hold on', 'sign up', 'pull leg'],
    ans: 1,
    exp: '【解析】電話用語 Please hold on. 代表「請稍候／請等一下」。'
  },
  {
    id: 'v4',
    prompt: '4. Sorry, you have the _______ number. Nobody named Marsha lives here.',
    tts: 'Sorry, you have the wrong number. Nobody named Marsha lives here.',
    options: ['wrong', 'same', 'interesting', 'poor'],
    ans: 0,
    exp: '【解析】wrong number 代表「打錯號碼／撥錯電話」。'
  },
  {
    id: 'v5',
    prompt: '5. _______ camera is this on the table? - It\'s mine.',
    tts: 'Whose camera is this on the table? It is mine.',
    options: ['Whose', 'Where', 'When', 'Who'],
    ans: 0,
    exp: '【解析】Whose 詢問「誰的（所有格疑問詞）」，後接名詞 camera。'
  },
  {
    id: 'v6',
    prompt: '6. Computer _______ is Cody\'s favorite subject.',
    tts: 'Computer science is Cody\'s favorite subject.',
    options: ['club', 'science', 'camera', 'violin'],
    ans: 1,
    exp: '【解析】computer science 代表「電腦科學」。'
  },
  {
    id: 'v7',
    prompt: '7. Shin _______ Yuki about the water sports club yesterday.',
    tts: 'Shin told Yuki about the water sports club yesterday.',
    options: ['heard', 'called', 'told', 'signed'],
    ans: 2,
    exp: '【解析】tell 的過去式為 told，句型為 tell sb about sth（告訴某人某事）。'
  },
  {
    id: 'v8',
    prompt: '8. Shin was a _______ swimmer last year, but now he swims like a fish.',
    tts: 'Shin was a poor swimmer last year, but now he swims like a fish.',
    options: ['same', 'wrong', 'poor', 'cute'],
    ans: 2,
    exp: '【解析】poor swimmer 代表「泳技不佳／拙劣的泳者」。'
  }
];

const grammarQuestions = [
  {
    id: 'g1',
    prompt: '9. This sandwich is _______ (my sandwich), not yours.',
    tts: 'This sandwich is mine, not yours.',
    options: ['mine', 'my', 'me'],
    ans: 0,
    exp: '【解析】所有格代名詞 mine = my sandwich，避免重複名詞。'
  },
  {
    id: 'g2',
    prompt: '10. This car is not his; it\'s _______ (that girl\'s car).',
    tts: 'This car is not his; it is hers.',
    options: ['her', 'hers', 'she'],
    ans: 1,
    exp: '【解析】所有格代名詞 hers = that girl\'s car（她的車）。'
  },
  {
    id: 'g3',
    prompt: '11. These jackets are _______ (their jackets). Ours are over there.',
    tts: 'These jackets are theirs. Ours are over there.',
    options: ['their', 'theirs', 'them'],
    ans: 1,
    exp: '【解析】theirs = their jackets（他們的夾克）。'
  },
  {
    id: 'g4',
    prompt: '12. Look at the basketballs. Whose are they? - They are _______ (those girls\' basketballs).',
    tts: 'Look at the basketballs. Whose are they? They are those girls\'.',
    options: ['those girls\'', 'those girl\'s', 'those girls'],
    ans: 0,
    exp: '【解析】複數名詞字尾有 s 時，所有格僅加撇號 \' (those girls\')。'
  },
  {
    id: 'g5',
    prompt: '13. _______ Miss Turner went to work, she bought a sandwich.',
    tts: 'Before Miss Turner went to work, she bought a sandwich.',
    options: ['Before', 'Whose', 'But'],
    ans: 0,
    exp: '【解析】Before 放在句首引導時間子句，表示「在去上班之前」。'
  },
  {
    id: 'g6',
    prompt: '14. Alan made his bed _______ he got up this morning.',
    tts: 'Alan made his bed after he got up this morning.',
    options: ['after', 'whose', 'or'],
    ans: 0,
    exp: '【解析】after 表「在...之後」，放句中連接兩個動作（起床後整理床鋪）。'
  },
  {
    id: 'g7',
    prompt: '15. _______ Zoey has free time, she practices soccer.',
    tts: 'When Zoey has free time, she practices soccer.',
    options: ['When', 'Whose', 'Mine'],
    ans: 0,
    exp: '【解析】When 表「當...的時候」，引導時間副詞子句。'
  }
];

let userAnswers = {};

function initQuestions() {
  const vContainer = document.getElementById('vocab-container');
  vocabQuestions.forEach((q, idx) => {
    vContainer.appendChild(createQuestionCard(q, idx + 1));
  });

  const gContainer = document.getElementById('grammar-container');
  grammarQuestions.forEach((q, idx) => {
    gContainer.appendChild(createQuestionCard(q, idx + 9));
  });
}

function createQuestionCard(q, num) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + q.id;

  const promptDiv = document.createElement('div');
  promptDiv.className = 'q-prompt';
  promptDiv.innerHTML = `<span>${q.prompt}</span>`;

  const ttsBtn = document.createElement('button');
  ttsBtn.className = 'tts-btn';
  ttsBtn.innerHTML = '🔊 點讀';
  ttsBtn.onclick = () => speak(q.tts);
  promptDiv.appendChild(ttsBtn);
  card.appendChild(promptDiv);

  const grid = document.createElement('div');
  grid.className = 'options-grid';

  q.options.forEach((opt, oIdx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<span><strong>(${String.fromCharCode(65 + oIdx)})</strong> ${opt}</span>`;
    btn.onclick = () => selectOption(q.id, oIdx, q.ans);
    btn.id = `btn-${q.id}-${oIdx}`;
    grid.appendChild(btn);
  });

  card.appendChild(grid);

  const exp = document.createElement('div');
  exp.className = 'explanation';
  exp.id = 'exp-' + q.id;
  exp.innerText = q.exp;
  card.appendChild(exp);

  return card;
}

function selectOption(qId, selectedIdx, correctIdx) {
  userAnswers[qId] = selectedIdx;
  const isCorrect = (selectedIdx === correctIdx);
  const card = document.getElementById('card-' + qId);
  const btns = card.querySelectorAll('.opt-btn');
  
  btns.forEach((btn, idx) => {
    btn.classList.remove('correct', 'wrong');
    if (idx === selectedIdx) {
      btn.classList.add(isCorrect ? 'correct' : 'wrong');
    }
  });

  document.getElementById('exp-' + qId).style.display = 'block';
}

function setSpeed(speed, btn) {
  currentSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = currentSpeed;

  const voiceSelect = document.getElementById('voiceSelect');
  const voices = window.speechSynthesis.getVoices();
  if (voiceSelect && voiceSelect.value !== '') {
    utter.voice = voices[voiceSelect.value];
  }
  window.speechSynthesis.speak(utter);
}

function initVoices() {
  const voiceSelect = document.getElementById('voiceSelect');
  const voices = window.speechSynthesis.getVoices();
  voiceSelect.innerHTML = '';
  
  let targetIdx = -1;
  voices.forEach((v, idx) => {
    if (v.lang.startsWith('en')) {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = `${v.name} (${v.lang})`;
      voiceSelect.appendChild(opt);
      if (targetIdx === -1 && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('US'))) {
        targetIdx = voiceSelect.options.length - 1;
      }
    }
  });

  if (targetIdx !== -1) {
    voiceSelect.selectedIndex = targetIdx;
  }
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = initVoices;
}

function submitExam() {
  const sName = document.getElementById('studentName').value.trim() || '未填寫姓名';
  let totalCorrect = 0;
  const allQs = [...vocabQuestions, ...grammarQuestions];

  allQs.forEach(q => {
    if (userAnswers[q.id] === q.ans) {
      totalCorrect++;
    }
    document.getElementById('exp-' + q.id).style.display = 'block';
  });

  const finalScore = Math.round((totalCorrect / allQs.length) * 100);
  document.getElementById('scoreText').innerText = finalScore;
  document.getElementById('scoreBanner').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  // Sync to GAS
  const payload = {
    unit: '國二 Unit 2 時間連接詞與所有格代名詞',
    level: 'C1 基礎組',
    name: sName,
    score: finalScore,
    totalQuestions: allQs.length,
    correctCount: totalCorrect,
    timestamp: new Date().toISOString()
  };

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('syncStatus').innerText = '✅ 成績已成功記錄並同步至教師雲端後台！';
  }).catch(() => {
    document.getElementById('syncStatus').innerText = '⚠️ 成績已完成評分（雲端同步已排程）。';
  });
}

window.onload = () => {
  initQuestions();
  setTimeout(initVoices, 200);
};
</script>

</body>
</html>
