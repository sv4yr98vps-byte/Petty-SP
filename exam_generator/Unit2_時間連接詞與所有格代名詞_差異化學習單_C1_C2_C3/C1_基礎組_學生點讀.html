      font-size: 1.25rem;
      font-weight: 700;

      align-items: center;
      gap: 8px;

    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.04);
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--primary);
    }

    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .module-tag {
      background: #d1fae5;
      color: #065f46;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .hint-btn {
      background: var(--hint-bg);
      color: var(--hint-text);
      border: 1px solid #fde68a;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }

    .hint-btn:hover { background: #fde68a; }

    .q-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: #064e3b;
      line-height: 1.5;
      margin-bottom: 12px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;

      color: #0284c7;

let userAnswers = {};

function renderQuestions() {
  const vContainer = document.getElementById('vocab-container');
  const gContainer = document.getElementById('grammar-container');

  vocabQuestions.forEach((q, idx) => {
    vContainer.appendChild(createQuestionCard(q, idx, 4));
  });

  grammarQuestions.forEach((q, idx) => {
    gContainer.appendChild(createQuestionCard(q, idx + vocabQuestions.length, 3));
  });
}

function createQuestionCard(q, index, optCount) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + q.id;

  const meta = document.createElement('div');
  meta.className = 'q-meta';
  meta.innerHTML = `
    <span class="module-tag">${q.module}</span>
    <button type="button" class="hint-btn" onclick="showHint('${q.id}', '${escapeQuotes(q.hint)}')">💡 提示</button>
  `;
  card.appendChild(meta);

  const title = document.createElement('div');
  title.className = 'q-title';
  title.innerHTML = `
    <span>${q.zhTitle}</span>
    <button type="button" class="speaker-btn" onclick="speakEnglish('${escapeQuotes(q.tts)}')">🔊 英文朗讀</button>
  `;
  card.appendChild(title);

  const visual = document.createElement('div');
  visual.className = 'visual-box';
  visual.innerHTML = q.visual;
  card.appendChild(visual);

  const grid = document.createElement('div');
  grid.className = optCount === 4 ? 'options-grid-4' : 'options-grid-3';

  const letters = ['(A)', '(B)', '(C)', '(D)'];
  q.options.forEach((opt, optIdx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt-btn';
    btn.id = `btn-${q.id}-${optIdx}`;
    btn.innerHTML = `<strong>${letters[optIdx]}</strong> ${opt}`;
    btn.onclick = () => selectOption(q, optIdx);
    grid.appendChild(btn);
  });
  card.appendChild(grid);

  const feedback = document.createElement('div');
  feedback.className = 'feedback-box';
  feedback.id = 'fb-' + q.id;
  card.appendChild(feedback);

  return card;
}

function escapeQuotes(str) {
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function selectOption(q, selectedIdx) {
  userAnswers[q.id] = selectedIdx;

  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById(`btn-${q.id}-${i}`);
    if (btn) btn.className = 'opt-btn';
  }

  const selectedBtn = document.getElementById(`btn-${q.id}-${selectedIdx}`);
  const fb = document.getElementById('fb-' + q.id);
  fb.style.display = 'block';

  if (selectedIdx === q.ans) {
    if (selectedBtn) selectedBtn.classList.add('correct');
    fb.style.background = '#dcfce7';
    fb.style.border = '1px solid #86efac';
    fb.style.color = '#15803d';
    fb.innerHTML = `<strong>✨ 答對了！</strong> ${q.expCorrect}`;
    speakChinese(q.expCorrect);
  } else {
    if (selectedBtn) selectedBtn.classList.add('wrong');
    fb.style.background = '#fee2e2';
    fb.style.border = '1px solid #fca5a5';
    fb.style.color = '#b91c1c';
    fb.innerHTML = `<strong>❌ 再想想看：</strong> ${q.expWrong}`;
    speakChinese(q.expWrong);
  }
}

function showHint(qId, hintText) {
  const fb = document.getElementById('fb-' + qId);
  fb.style.display = 'block';
  fb.style.background = '#fef3c7';
  fb.style.border = '1px solid #fde68a';
  fb.style.color = '#92400e';
  fb.innerHTML = `<strong>💡 提示引導：</strong> ${hintText}`;
  speakChinese(hintText);
}

function setSpeed(speed, btn) {
  currentSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function speakEnglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = currentSpeed;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && v.lang.includes('US')) ||
                  voices.find(v => v.lang.startsWith('en')) || voices[0];
  if (enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  utter.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && (v.lang.includes('zh') || v.lang.includes('TW'))) ||
                  voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('cmn-Hant-TW') || v.lang.includes('TW')) || voices[0];
  if (zhVoice) utter.voice = zhVoice;
  window.speechSynthesis.speak(utter);
}

function submitExam() {
  const allQs = [...vocabQuestions, ...grammarQuestions];
  let correctCount = 0;

  allQs.forEach(q => {
    if (userAnswers[q.id] === q.ans) {
      correctCount++;
    }
  });

  const finalScore = Math.round((correctCount / allQs.length) * 100);
  const sName = document.getElementById('studentName').value.trim() || '未填寫姓名';

  document.getElementById('scoreText').innerText = finalScore;
  document.getElementById('scoreBanner').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  const payload = {
    unit: '國二 Unit 2 時間連接詞與所有格代名詞',
    level: 'C1 基礎組',
    name: sName,
    score: finalScore,
    totalQuestions: allQs.length,
    correctCount: correctCount,
    timestamp: new Date().toISOString()
  };

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('syncStatus').innerText = '✅ 成績已成功記錄並同步至教師後台！';
  }).catch(() => {
    document.getElementById('syncStatus').innerText = '⚠️ 成績已計算（離線暫存模式）。';
  });
}

window.onload = () => {
  renderQuestions();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
  }
};
</script>
