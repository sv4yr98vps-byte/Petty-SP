let userAnswers = {};
let attemptsPerQ = {};
let answeredLocked = {};
let totalErrors = 0;

function renderQuestions() {
  const vContainer = document.getElementById('vocab-container');
  const gContainer = document.getElementById('grammar-container');
  if (vContainer) vContainer.innerHTML = '';
  if (gContainer) gContainer.innerHTML = '';

  if (typeof vocabQuestions !== 'undefined' && Array.isArray(vocabQuestions)) {
    vocabQuestions.forEach((q, idx) => {
      if (vContainer) vContainer.appendChild(createQuestionCard(q, idx, 4));
    });
  }

  if (typeof grammarQuestions !== 'undefined' && Array.isArray(grammarQuestions)) {
    grammarQuestions.forEach((q, idx) => {
      const vLen = (typeof vocabQuestions !== 'undefined') ? vocabQuestions.length : 0;
      if (gContainer) gContainer.appendChild(createQuestionCard(q, idx + vLen, 3));
    });
  }
}

function createQuestionCard(q, index, optCount) {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + q.id;

  const meta = document.createElement('div');
  meta.className = 'q-meta';
  meta.innerHTML = `
    <span class="module-tag">${q.module || '基礎題'}</span>
    <button type="button" class="hint-btn" onclick="showHint('${q.id}', '${escapeQuotes(q.hint)}')">💡 提示</button>
  `;
  card.appendChild(meta);

  const title = document.createElement('div');
  title.className = 'q-title';
  title.innerHTML = `
    <span>${q.zhTitle}</span>
    <button type="button" class="speaker-btn" onclick="speakEnglish('${escapeQuotes(q.tts || q.zhTitle)}')">🔊 英文朗讀</button>
  `;
  card.appendChild(title);

  const visual = document.createElement('div');
  visual.className = 'visual-box';
  visual.innerHTML = q.visual || '';
  card.appendChild(visual);

  const grid = document.createElement('div');
  grid.className = optCount === 4 ? 'options-grid-4' : 'options-grid-3';

  const letters = ['(A)', '(B)', '(C)', '(D)'];
  q.options.forEach((opt, optIdx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt-btn';
    btn.id = `btn-${q.id}-${optIdx}`;
    btn.innerHTML = `<strong>${letters[optIdx]}</strong> ${opt}`;
    btn.onclick = () => selectOption(q, optIdx);
    grid.appendChild(btn);
  });
  card.appendChild(grid);

  const feedback = document.createElement('div');
  feedback.className = 'feedback-box';
  feedback.id = 'fb-' + q.id;
  card.appendChild(feedback);

  return card;
}

function escapeQuotes(str) {
  return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function selectOption(q, selectedIdx) {
  if (answeredLocked[q.id]) return;
  if (attemptsPerQ[q.id] === undefined) attemptsPerQ[q.id] = 0;

  const selectedBtn = document.getElementById(`btn-${q.id}-${selectedIdx}`);
  const fb = document.getElementById('fb-' + q.id);
  fb.style.display = 'block';

  if (selectedIdx === q.ans) {
    answeredLocked[q.id] = true;
    userAnswers[q.id] = selectedIdx;
    if (selectedBtn) selectedBtn.classList.add('correct');

    const errCount = attemptsPerQ[q.id];
    let badgeText = '🥇 首次即答對！';
    if (errCount === 1) {
      badgeText = '⚠️ 試錯 1 次後答對 (得分 70%)';
    } else if (errCount === 2) {
      badgeText = '⚠️ 試錯 2 次後答對 (得分 40%)';
    } else if (errCount >= 3) {
      badgeText = '❌ 試錯多次後答對 (鼓勵分 10%)';
    }

    fb.style.background = '#dcfce7';
    fb.style.border = '1px solid #86efac';
    fb.style.color = '#15803d';
    fb.innerHTML = `<strong>✨ 答對了！</strong> ${q.expCorrect || '完全正確！'} <div style="font-size:0.88rem; margin-top:4px; font-weight:700; color:#047857;">[${badgeText}]</div>`;
    speakChinese(q.expCorrect || '完全正確！');

    for (let i = 0; i < q.options.length; i++) {
      const btn = document.getElementById(`btn-${q.id}-${i}`);
      if (btn && i !== selectedIdx) {
        btn.disabled = true;
        btn.style.opacity = '0.5';
      }
    }
  } else {
    attemptsPerQ[q.id]++;
    totalErrors++;
    if (selectedBtn) {
      selectedBtn.classList.add('wrong');
      selectedBtn.disabled = true;
    }
    fb.style.background = '#fee2e2';
    fb.style.border = '1px solid #fca5a5';
    fb.style.color = '#b91c1c';
    fb.innerHTML = `<strong>❌ 再想想看：</strong> ${q.expWrong || '請再思考看看喔！'} <span style="font-size:0.85rem; color:#b91c1c;">(已試錯 ${attemptsPerQ[q.id]} 次)</span>`;
    speakChinese(q.expWrong || '再想想看喔');
  }
}

function showHint(qId, hintText) {
  const fb = document.getElementById('fb-' + qId);
  fb.style.display = 'block';
  fb.style.background = '#fef3c7';
  fb.style.border = '1px solid #fde68a';
  fb.style.color = '#92400e';
  fb.innerHTML = `<strong>💡 提示引導：</strong> ${hintText}`;
  speakChinese(hintText);
}

function setSpeed(speed, btn) {
  currentSpeed = speed;
  document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function speakEnglish(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = currentSpeed;
  const voices = window.speechSynthesis.getVoices();
  const enVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && v.lang.includes('US')) ||
                  voices.find(v => v.lang.startsWith('en')) || voices[0];
  if (enVoice) utter.voice = enVoice;
  window.speechSynthesis.speak(utter);
}

function speakChinese(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-TW';
  utter.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('google')) && (v.lang.includes('zh') || v.lang.includes('TW'))) ||
                  voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('cmn-Hant-TW') || v.lang.includes('TW')) || voices[0];
  if (zhVoice) utter.voice = zhVoice;
  window.speechSynthesis.speak(utter);
}

function submitExam() {
  const allQs = [...(typeof vocabQuestions !== 'undefined' ? vocabQuestions : []), ...(typeof grammarQuestions !== 'undefined' ? grammarQuestions : [])];
  let totalScore = 0;
  let firstTryCorrect = 0;
  let detailsList = [];
  const basePts = 100.0 / (allQs.length || 1);

  allQs.forEach((q, idx) => {
    const errs = attemptsPerQ[q.id] || 0;
    const isAnswered = answeredLocked[q.id];
    let multiplier = 0;
    let badge = '❌ 未作答';

    if (isAnswered) {
      if (errs === 0) {
        multiplier = 1.0;
        firstTryCorrect++;
        badge = '🥇 首次即答對 (滿分)';
      } else if (errs === 1) {
        multiplier = 0.7;
        badge = '⚠️ 試錯 1 次 (70% 分數)';
      } else if (errs === 2) {
        multiplier = 0.4;
        badge = '⚠️ 試錯 2 次 (40% 分數)';
      } else {
        multiplier = 0.1;
        badge = '❌ 試錯多次 (10% 鼓勵分)';
      }
    }
    totalScore += basePts * multiplier;
    detailsList.push(`第 ${idx + 1} 題: ${badge}`);
  });

  const finalScore = Math.max(10, Math.round(totalScore));
  const firstTryRate = Math.round((firstTryCorrect / (allQs.length || 1)) * 100);
  const sNameEl = document.getElementById('studentName');
  const sName = (sNameEl ? sNameEl.value.trim() : '') || '未填寫姓名';

  document.getElementById('scoreText').innerText = `${finalScore} 分`;
  document.getElementById('firstTryText').innerText = `${firstTryCorrect} / ${allQs.length} 題 (${firstTryRate}%)`;
  document.getElementById('attemptsText').innerText = `${totalErrors} 次`;
  document.getElementById('certStudentText').innerText = `學生：${sName} ｜ 表現評價：${finalScore >= 90 ? '⭐⭐⭐ 精熟特優' : (finalScore >= 70 ? '⭐⭐ 表現良好' : '⭐ 需再加強')}`;

  const detailBox = document.getElementById('resDetailsContainer');
  if (detailBox) {
    detailBox.innerHTML = detailsList.map(item => `<div style="padding:6px 10px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;">${item}</div>`).join('');
  }

  document.getElementById('scoreBanner').style.display = 'block';
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  speakChinese(`評量完成！最終得分 ${finalScore} 分，首次答對 ${firstTryCorrect} 題。`);

  const payload = {
    unit: document.title || '國中英語差異化學習單',
    level: 'C1 基礎組',
    name: sName,
    score: finalScore,
    firstTryRate: `${firstTryRate}%`,
    firstTryCorrect: `${firstTryCorrect}/${allQs.length}`,
    wrongAttempts: totalErrors,
    details: detailsList.join('; '),
    timestamp: new Date().toISOString()
  };

  fetch(GAS_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(() => {
    document.getElementById('syncStatus').innerText = '✅ 成績與作答歷程已成功同步至教師後台！';
    document.getElementById('syncStatus').style.background = '#d1fae5';
    document.getElementById('syncStatus').style.color = '#065f46';
  }).catch(() => {
    document.getElementById('syncStatus').innerText = '⚠️ 成績已記錄（離線暫存模式）。';
  });
}

// CRITICAL: Execute immediately so DOM renders without waiting for onload
renderQuestions();
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
}
</script>
