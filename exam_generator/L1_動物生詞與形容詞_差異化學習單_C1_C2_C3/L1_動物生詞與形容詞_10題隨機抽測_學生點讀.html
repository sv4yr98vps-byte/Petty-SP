<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國中英語【國一 · 七年級】L1 動物生詞與形容詞 10題線上抽測</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #eff6ff;
      --card-bg: #ffffff;
      --text: #1e3a8a;
      --border: #bfdbfe;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans TC', 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(37,99,235,0.15);
    }

    header h1 { font-size: 1.65rem; margin-bottom: 6px; font-weight: 700; }
    header p { font-size: 0.95rem; opacity: 0.95; }

    .container {
      max-width: 820px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .info-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .input-name {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .q-prompt {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-speak {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      color: #1e40af;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-speak:hover { background: #2563eb; color: white; }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }

    .opt-btn {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 10px;
      text-align: left;
      font-size: 0.98rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .opt-btn:hover { background: #f1f5f9; }

    .opt-btn.correct {
      background: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
      font-weight: 700;
    }

    .opt-btn.wrong {
      background: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    .bottom-bar { text-align: center; margin-top: 30px; }

    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 36px;
      border-radius: 30px;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37,99,235,0.3);
    }

    .btn-submit:hover { background: var(--primary-hover); transform: translateY(-2px); }
  </style>
</head>
<body>

  <header>
    <h1>國中英語【國一 · 七年級】L1 動物生詞與形容詞</h1>
    <p>🎲 核心大題庫 · 線上隨機抽取 10 題 · Google 試算表即時同步</p>
  </header>

  <div class="container">
    <div class="info-bar">
      <div>
        <label>👤 學生姓名 / 座號：</label>
        <input type="text" id="studentName" class="input-name" placeholder="例：701 陳同學">
      </div>
      <div>
        <label>⚡ 朗讀語速：</label>
        <select id="speedSelect" style="padding:5px 8px; border-radius:6px; border:1px solid #cbd5e1;">
          <option value="0.25">🐢 0.25x 極慢速</option>
          <option value="0.4">🐢 0.4x 慢速</option>
          <option value="0.6">0.6x 初學</option>
          <option value="0.85" selected>0.85x 適中</option>
          <option value="1.0">1.0x 標準</option>
        </select>
        <a href="index.html" style="text-decoration:none; margin-left:8px; color:var(--primary); font-weight:bold;">🏠 回單元首頁</a>
      </div>
    </div>

    <div id="quiz-container"></div>

    <div class="bottom-bar">
      <button class="btn-submit" onclick="submitQuiz()" type="button">📤 交卷並同步至全班學習儀表板</button>
      <div id="submit-status" style="margin-top:14px; font-weight:bold; font-size:1.05rem;"></div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbz9DwqtUX3HliNfYeWu5eb1nnNfE_MfLGw6Jp5NqgQDOia34ld789O6VonfTjkh_rqE/exec';
    
    // 大題庫 (共 20 題供每次隨機抽取 10 題)
    const questionBank = [
      { q: 'What is the English word for "獅子"?', opts: ['lion', 'tiger', 'zebra', 'monkey'], ans: 0 },
      { q: 'What is the English word for "大象"?', opts: ['sheep', 'goat', 'elephant', 'hippo'], ans: 2 },
      { q: 'What is the English word for "斑馬"?', opts: ['zebra', 'bear', 'frog', 'bee'], ans: 0 },
      { q: 'What is the English word for "猴子"?', opts: ['mouse', 'monkey', 'goose', 'ant'], ans: 1 },
      { q: 'What is the English word for "熊"?', opts: ['bear', 'lion', 'bee', 'hippo'], ans: 0 },
      { q: 'What is the English word for "蜜蜂"?', opts: ['ant', 'bee', 'frog', 'goat'], ans: 1 },
      { q: 'What is the English word for "青蛙"?', opts: ['frog', 'fish', 'mouse', 'zebra'], ans: 0 },
      { q: 'What is the English word for "河馬"?', opts: ['elephant', 'hippo', 'lion', 'bear'], ans: 1 },
      { q: 'What is the English word for "綿羊"?', opts: ['goat', 'sheep', 'goose', 'ant'], ans: 1 },
      { q: 'What is the English word for "山羊"?', opts: ['goat', 'sheep', 'bear', 'frog'], ans: 0 },
      { q: 'Jack is tall and ________. He can lift a heavy table.', opts: ['strong', 'dirty', 'angry', 'young'], ans: 0 },
      { q: 'Please wash your hands. They are very ________.', opts: ['clean', 'dirty', 'favorite', 'hairy'], ans: 1 },
      { q: 'Peter did not finish his homework, so his mom is ________.', opts: ['angry', 'young', 'brown', 'sweet'], ans: 0 },
      { q: 'The dog is big, ________ it is very friendly to children.', opts: ['and', 'so', 'but', 'or'], ans: 2 },
      { q: 'What is your ________ fruit? I love sweet apples.', opts: ['favorite', 'dirty', 'hairy', 'clean'], ans: 0 },
      { q: 'There are many trees in the big ________.', opts: ['birthday', 'forest', 'point', 'winner'], ans: 1 },
      { q: 'Look at those big ________ on the snow!', opts: ['footprints', 'pictures', 'shows', 'cookies'], ans: 0 },
      { q: 'Harry won first place. He is the ________!', opts: ['winner', 'picture', 'cookie', 'point'], ans: 0 },
      { q: 'One goose, two ________.', opts: ['gooses', 'geese', 'goosies', 'geeses'], ans: 1 },
      { q: 'One mouse, two ________.', opts: ['mouses', 'mice', 'mices', 'mousees'], ans: 1 }
    ];

    let currentQuiz = [];
    const userAnswers = {};

    let bestEnVoice = null;
    let bestZhVoice = null;

    function initVoices() {
      const voices = window.speechSynthesis.getVoices();
      bestEnVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Natural')) && v.lang.startsWith('en'))
                 || voices.find(v => v.lang.startsWith('en')) || null;
      bestZhVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Han')) && (v.lang.includes('TW') || v.lang.includes('zh')))
                 || voices.find(v => v.lang.startsWith('zh')) || null;
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const sp = parseFloat(document.getElementById('speedSelect').value) || 0.85;
      const utt = new SpeechSynthesisUtterance(text);
      utt.rate = sp;
      if (/[a-zA-Z]/.test(text)) {
        if (bestEnVoice) utt.voice = bestEnVoice;
        utt.lang = 'en-US';
      } else {
        if (bestZhVoice) utt.voice = bestZhVoice;
        utt.lang = 'zh-TW';
      }
      window.speechSynthesis.speak(utt);
    }

    function initRandomQuiz() {
      const shuffled = questionBank.slice().sort(() => Math.random() - 0.5);
      currentQuiz = shuffled.slice(0, 10);

      const container = document.getElementById('quiz-container');
      container.innerHTML = '';

      currentQuiz.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'card';

        const prompt = document.createElement('div');
        prompt.className = 'q-prompt';
        prompt.innerHTML = '<span>' + (idx + 1) + '. ' + item.q + '</span>';

        const speakBtn = document.createElement('button');
        speakBtn.className = 'btn-speak';
        speakBtn.textContent = '🔊 點讀';
        speakBtn.onclick = () => speakText(item.q);
        prompt.appendChild(speakBtn);
        card.appendChild(prompt);

        const optsDiv = document.createElement('div');
        optsDiv.className = 'options-grid';

        const labels = ['A', 'B', 'C', 'D'];
        item.opts.forEach((optText, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.textContent = '(' + labels[optIdx] + ') ' + optText;
          btn.onclick = () => {
            userAnswers[idx] = optIdx;
            const siblings = optsDiv.querySelectorAll('.opt-btn');
            siblings.forEach((s, sIdx) => {
              s.disabled = true;
              if (sIdx === item.ans) s.classList.add('correct');
              else if (sIdx === optIdx && optIdx !== item.ans) s.classList.add('wrong');
            });
          };
          optsDiv.appendChild(btn);
        });

        card.appendChild(optsDiv);
        container.appendChild(card);
      });
    }

    function submitQuiz() {
      const name = document.getElementById('studentName').value.trim() || '七年級隨機抽測學生';
      let correct = 0;
      currentQuiz.forEach((item, idx) => {
        if (userAnswers[idx] === item.ans) correct++;
      });

      const totalScore = correct * 10;
      const accuracy = totalScore + '%';
      let stars = '⭐⭐⭐';
      if (totalScore < 60) stars = '⭐';
      else if (totalScore < 85) stars = '⭐⭐';

      const statusEl = document.getElementById('submit-status');
      statusEl.style.color = '#2563eb';
      statusEl.textContent = '📡 正在同步成績至老師的 Google 試算表...';

      const payload = {
        timestamp: new Date().toLocaleString('zh-TW', { timeZone: 'Asia/Taipei' }),
        studentName: name,
        unit: '國中英語七上 L1 動物與生詞',
        level: '隨機抽測 10 題',
        score: totalScore,
        accuracy: accuracy,
        stars: stars
      };

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).then(() => {
        statusEl.innerHTML = '🎉 <strong>交卷成功！</strong> 得分：<span style="color:#2563eb;">' + totalScore + ' 分</span> (' + accuracy + ')，已同步至全班學習儀表板！';
        alert('🎉 交卷成功！\n學生：' + name + '\n得分：' + totalScore + ' 分 (' + accuracy + ')\n星級：' + stars);
      }).catch(err => {
        statusEl.innerHTML = '🎉 作答完成！得分：' + totalScore + ' 分 (離線記錄)';
      });
    }

    initRandomQuiz();
  </script>
</body>
</html>
